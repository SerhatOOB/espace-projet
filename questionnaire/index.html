*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--fond)}
body{position:relative;margin:0;min-height:100vh;background:var(--fond);color:var(--encre);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body::after{content:"";position:absolute;right:0;bottom:0;width:min(340px,70vw);aspect-ratio:300 / 120;background:var(--triade) no-repeat right bottom / contain;pointer-events:none}
h1,h2,p,fieldset,legend{margin:0;padding:0}
fieldset{border:0;min-width:0}
b,strong{font-weight:700}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--bleu);outline-offset:2px}
::selection{background:var(--rose);color:var(--suie)}
.secours{max-width:640px;margin:96px auto;padding:0 24px}

#app{min-height:100vh;display:flex;flex-direction:column;padding-bottom:min(150px,30vw)}
.q-barre{display:flex;align-items:center;gap:14px;width:100%;max-width:700px;margin:0 auto;padding:24px 24px 0}
.logo{display:block;height:28px;aspect-ratio:314 / 163;background:var(--logo) no-repeat center / contain}
.q-sep{width:1px;height:18px;background:var(--filet-2)}
.q-bu{font-family:var(--titre);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--attenue);padding-top:2px}
.q-page{flex:1;width:100%;max-width:700px;margin:0 auto;padding:40px 24px 40px;display:flex;flex-direction:column;gap:28px}
.q-pied{position:relative;z-index:1;text-align:center;font-size:13px;color:var(--discret);padding:0 24px 24px}

/* L'en-tête : le titre en capitales étroites, la vague rose dessous */
.q-tete{display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--titre);font-weight:600;font-size:clamp(42px,9.4vw,66px);line-height:.92;letter-spacing:.005em;text-transform:uppercase;text-wrap:balance}
h1::after{content:"";display:block;width:min(190px,60%);height:10px;margin-top:14px;background:var(--rose);-webkit-mask:var(--vague) no-repeat left center / contain;mask:var(--vague) no-repeat left center / contain}
.q-intro{font-size:17px;line-height:1.5;color:var(--attenue);max-width:60ch;text-wrap:pretty}
.q-anonyme{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;background:var(--vert-teinte);box-shadow:inset 4px 0 0 var(--vert)}
.q-anonyme p{font-size:15px;line-height:1.5;color:var(--encre)}
.q-cadenas{flex:none;display:grid;place-items:center;width:22px;height:22px;color:var(--vert-texte)}
.q-consigne{font-size:15px;color:var(--attenue)}

/* Les questions : des blocs nets, numérotés dans les trois couleurs */
.q-form{display:flex;flex-direction:column;gap:14px}
.q-question{display:flex;flex-direction:column;gap:8px;background:var(--papier);border:1px solid var(--filet);padding:22px 22px 20px;transition:border-color .15s}
.q-question:focus-within{border-color:var(--encre)}
.q-titre{display:flex;align-items:flex-start;gap:12px;font-size:18px;font-weight:700;line-height:1.3}
.q-num{flex:none;display:grid;place-items:center;width:30px;height:30px;margin-top:-3px;border-radius:3px;background:var(--rose);color:var(--suie);font-family:var(--titre);font-weight:600;font-size:21px}
.q-question:nth-child(3n+2) .q-num{background:var(--bleu)}
.q-question:nth-child(3n) .q-num{background:var(--vert)}
.q-aide{font-size:14.5px;line-height:1.45;color:var(--discret);padding-left:42px}
.q-texte{display:block;width:100%;min-height:112px;margin-top:4px;padding:12px 14px;border:1px solid var(--filet-2);border-radius:6px;background:var(--pierre);font-size:16px;line-height:1.5;resize:vertical;overflow:hidden;transition:border-color .15s,box-shadow .15s,background .15s}
.q-texte:focus{outline:none;border-color:var(--encre);background:var(--papier);box-shadow:0 0 0 3px var(--rose-teinte)}
.q-metiers legend{float:left;width:100%;margin-bottom:8px}
.q-metiers .q-aide{clear:both;padding-left:0}
.q-puces{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.q-puce{position:relative}
.q-puce input{position:absolute;opacity:0;width:1px;height:1px}
.q-puce span{display:inline-flex;align-items:center;min-height:40px;padding:8px 15px;border-radius:20px;border:1.5px solid var(--filet-2);font-size:15px;font-weight:500;cursor:pointer;user-select:none;transition:background .15s,border-color .15s,color .15s}
.q-puce span:hover{border-color:var(--encre)}
.q-puce input:checked + span{background:var(--encre);border-color:var(--encre);color:var(--fond);font-weight:700}
.q-puce input:focus-visible + span{outline:2px solid var(--bleu);outline-offset:2px}

/* L'envoi */
.q-envoi{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-top:8px}
.q-rappel{font-size:14.5px;color:var(--attenue)}
.q-piege{position:absolute;left:-10000px;width:1px;height:1px;opacity:0}
.q-bouton{border:0;border-radius:999px;padding:15px 26px;font-size:16.5px;font-weight:700;color:var(--papier-lusko);background:var(--suie);transition:background .15s,color .15s,transform .12s}
.q-bouton:hover{background:var(--rose);color:var(--suie)}
.q-bouton:active{transform:scale(.98)}
.q-bouton:disabled{opacity:.6;cursor:default;transform:none}
.q-bouton.secondaire{background:none;color:var(--encre);box-shadow:inset 0 0 0 1.5px var(--encre)}
.q-bouton.secondaire:hover{background:var(--rose);color:var(--suie);box-shadow:inset 0 0 0 1.5px var(--rose)}
@media (prefers-color-scheme:dark){
  .q-bouton{background:var(--papier-lusko);color:var(--suie)}
  .q-bouton:hover{background:var(--rose)}
}
.q-statut{font-size:15px;color:var(--attenue)}
.q-statut:empty{display:none}
.q-statut.erreur{color:var(--rouge-texte);font-weight:700}

/* Merci, ou fermé */
.q-fin{display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding-top:8px}
.q-fin h1{outline:none}
.q-coche{position:relative;width:56px;height:56px;border-radius:3px;background:var(--vert);box-shadow:6px 6px 0 var(--rose),12px 12px 0 var(--bleu);margin-bottom:12px}
.q-coche::after{content:"";position:absolute;left:21px;top:13px;width:11px;height:21px;border-right:4px solid var(--suie);border-bottom:4px solid var(--suie);transform:rotate(45deg)}

@media (max-width:560px){
  .q-barre{padding:18px 18px 0}
  .q-page{padding:30px 16px 36px;gap:24px}
  .q-question{padding:18px 16px 16px}
  .q-aide{padding-left:0}
  .q-bouton{width:100%}
  .q-envoi{align-items:stretch}
}
@keyframes monte{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ondule{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes glisse-angle{from{opacity:0;transform:translate(80px,60px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){
  .q-page > *{animation:monte .5s var(--ease) both}
  .q-page > :nth-child(2){animation-delay:.07s}
  h1::after{animation:ondule 1.1s var(--ease) .3s both}
  body::after{animation:glisse-angle .9s var(--ease) .4s both}
}

<body>
<div id="app"><noscript><p class="secours">Ce questionnaire a besoin de JavaScript pour s'afficher.</p></noscript></div>
<script id="config">window.QUESTIONNAIRE_CONFIG = {"url": "https://rgsewrjkazqnizpyjzzm.supabase.co", "cle": "sb_publishable_f6Icf4lPGIT0U7HqKSiVLg_ULWQHyl2", "espace": "visite-orange", "jusqu_au": "2027-01-18", "questions": [{"cle": "freins", "titre": "Qu'est-ce qui vous freine au quotidien ?", "aide": "Offres, outils, commandes, délais, relation avec Orange…"}, {"cle": "atouts", "titre": "Qu'est-ce qui marche bien et qu'il faut garder ?", "aide": "Ce qui vous aide à vendre ou à bien servir vos clients."}, {"cle": "demande", "titre": "Si vous pouviez demander une seule chose à Orange, ce serait quoi ?", "aide": "Une demande précise, même petite."}, {"cle": "autre", "titre": "Autre chose à dire ?", "aide": "Une idée, une remarque, un sujet qu'on n'a pas abordé."}], "metiers": [["tmk", "TMK"], ["vad", "VAD"], ["ic", "IC terrain"], ["back-office", "Back office"], ["encadrement", "Encadrement"]]};</script>
<script id="code">(function () {
  "use strict";

  /* Questionnaire anonyme de la BU Orange de LUSKO.
     Aucune connexion : la page envoie les réponses à une seule fonction de la base, qui ne garde que le jour de réception.
     Ni nom, ni adresse, ni compte : rien de la personne ne part avec ses réponses.
     Le brouillon reste sur l'appareil tant que les réponses ne sont pas envoyées. */

  var C = window.QUESTIONNAIRE_CONFIG || {};
  var app = document.getElementById("app");
  if (!app) return;
  var QUESTIONS = (C.questions || []).filter(function (q) { return q && q.cle && q.titre; });
  var METIERS = (C.metiers || []).filter(function (m) { return Array.isArray(m) && m[0] && m[1]; });
  var BROUILLON = "questionnaire-" + (C.espace || "") + "-brouillon";
  var MAX = 4000;
  var MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  var JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];

  function el(balise, attrs, enfants) {
    var n = document.createElement(balise);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "text") n.textContent = v;
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : String(v));
    });
    (enfants || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      if (Array.isArray(c)) c.forEach(function (x) { if (x) n.appendChild(typeof x === "string" ? document.createTextNode(x) : x); });
      else n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return n;
  }
  function cadenas() {
    var ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 16 16");
    svg.setAttribute("width", "20");
    svg.setAttribute("height", "20");
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("focusable", "false");
    ["M3.6 7.4h8.8c.6 0 1.1.5 1.1 1.1v4.9c0 .6-.5 1.1-1.1 1.1H3.6c-.6 0-1.1-.5-1.1-1.1V8.5c0-.6.5-1.1 1.1-1.1z", "M5.2 7.4V5.3a2.8 2.8 0 0 1 5.6 0v2.1", "M8 10.2v1.6"].forEach(function (d) {
      var p = document.createElementNS(ns, "path");
      p.setAttribute("d", d);
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", "currentColor");
      p.setAttribute("stroke-width", "1.6");
      p.setAttribute("stroke-linecap", "round");
      p.setAttribute("stroke-linejoin", "round");
      svg.appendChild(p);
    });
    return svg;
  }
  function lire(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function ecrire(k, v) { try { if (v === null) window.localStorage.removeItem(k); else window.localStorage.setItem(k, v); } catch (e) { /* mémoire indisponible */ } }

  // Dates à l'heure de Paris
  function aujourdhui() {
    try { return new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Paris", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date()); }
    catch (e) { return new Date().toISOString().slice(0, 10); }
  }
  function iso(s) { return typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : ""; }
  function enDate(s) { var p = s.split("-").map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
  function quantieme(n) { return n === 1 ? "1er" : String(n); }
  function jourMois(s) { var d = enDate(s); return JOURS[d.getUTCDay()] + " " + quantieme(d.getUTCDate()) + " " + MOIS[d.getUTCMonth()]; }
  var JUSQU = iso(C.jusqu_au);
  function ouvert() { return !JUSQU || aujourdhui() <= JUSQU; }

  /* ---------- Écrans ---------- */

  function cadre(contenu) {
    app.textContent = "";
    app.appendChild(el("header", { class: "q-barre" }, [
      el("span", { class: "logo", role: "img", "aria-label": "LUSKO" }),
      el("span", { class: "q-sep", "aria-hidden": "true" }),
      el("span", { class: "q-bu", text: "BU Orange" })
    ]));
    app.appendChild(el("main", { class: "q-page" }, contenu));
    app.appendChild(el("footer", { class: "q-pied", text: "Questionnaire de la BU Orange de LUSKO" }));
  }

  function ecranFerme() {
    cadre([el("section", { class: "q-fin" }, [
      el("h1", { text: "Le questionnaire est fermé" }),
      el("p", { class: "q-intro", text: (JUSQU ? "Il était ouvert jusqu'au " + jourMois(JUSQU) + ". " : "") + "Merci à celles et ceux qui ont répondu." })
    ])]);
  }

  function ecranMerci() {
    var titre = el("h1", { tabindex: "-1", text: "Merci, c'est envoyé." });
    cadre([el("section", { class: "q-fin" }, [
      el("span", { class: "q-coche", "aria-hidden": "true" }),
      titre,
      el("p", { class: "q-intro", text: "Vos réponses seront lues ensemble avant notre échange avec Orange." }),
      el("p", { class: "q-intro", text: "Une autre idée vous vient plus tard ? Revenez par le même lien, ou ajoutez-la maintenant." }),
      el("button", { type: "button", class: "q-bouton secondaire", "data-cle": "encore", text: "Ajouter autre chose", onclick: function () { ecranQuestionnaire({}); } })
    ])]);
    try { window.scrollTo(0, 0); titre.focus(); } catch (e) { /* sans défilement */ }
  }

  function ecranQuestionnaire(depart) {
    var brouillon = depart || {};
    var reponses = brouillon.reponses && typeof brouillon.reponses === "object" ? brouillon.reponses : {};
    var champs = {}, statut = el("p", { class: "q-statut", role: "status", "aria-live": "polite" });
    var envoi = el("button", { type: "submit", class: "q-bouton", "data-cle": "envoyer", text: "Envoyer mes réponses" });
    var piege = el("input", { type: "text", name: "site", class: "q-piege", tabindex: "-1", autocomplete: "off", "aria-hidden": "true" });
    var minuterie = null;

    function valeurs() {
      var r = {};
      QUESTIONS.forEach(function (q) { var v = String(champs[q.cle].value || "").trim(); if (v) r[q.cle] = v.slice(0, MAX); });
      var choisi = form.querySelector('input[name="metier"]:checked');
      return { reponses: r, metier: choisi && choisi.value ? choisi.value : "" };
    }
    function garder() {
      window.clearTimeout(minuterie);
      minuterie = window.setTimeout(function () {
        var v = valeurs();
        ecrire(BROUILLON, Object.keys(v.reponses).length || v.metier ? JSON.stringify(v) : null);
      }, 300);
    }
    function ajuster(t) { t.style.height = "auto"; t.style.height = Math.max(t.scrollHeight, 0) + "px"; }

    var blocs = QUESTIONS.map(function (q, i) {
      var id = "q-" + q.cle;
      var t = el("textarea", { id: id, class: "q-texte", name: q.cle, rows: "4", maxlength: String(MAX), "data-cle": "reponse-" + q.cle, "aria-describedby": q.aide ? id + "-aide" : null, oninput: function (e) { ajuster(e.target); garder(); } });
      t.value = typeof reponses[q.cle] === "string" ? reponses[q.cle] : "";
      champs[q.cle] = t;
      return el("div", { class: "q-question" }, [
        el("label", { class: "q-titre", for: id }, [el("span", { class: "q-num", "aria-hidden": "true", text: String(i + 1) }), el("span", { text: q.titre })]),
        q.aide ? el("p", { class: "q-aide", id: id + "-aide", text: q.aide }) : null,
        t
      ]);
    });

    var metier = typeof brouillon.metier === "string" ? brouillon.metier : "";
    var choix = [["", "Je préfère ne pas le dire"]].concat(METIERS).map(function (m) {
      return el("label", { class: "q-puce" }, [
        el("input", { type: "radio", name: "metier", value: m[0], checked: m[0] === metier, "data-cle": "metier-" + (m[0] || "aucun"), onchange: garder }),
        el("span", { text: m[1] })
      ]);
    });

    var form = el("form", { class: "q-form", novalidate: true, onsubmit: function (e) {
      e.preventDefault();
      statut.textContent = "";
      statut.className = "q-statut";
      var v = valeurs();
      if (!Object.keys(v.reponses).length) {
        statut.textContent = "Écrivez au moins une réponse avant d'envoyer.";
        statut.className = "q-statut erreur";
        var premier = champs[QUESTIONS[0] && QUESTIONS[0].cle];
        if (premier) premier.focus();
        return;
      }
      // Un robot remplit tous les champs, même invisibles : on le remercie sans rien envoyer.
      if (piege.value) { ecrire(BROUILLON, null); ecranMerci(); return; }
      envoi.disabled = true;
      envoi.textContent = "Envoi en cours";
      envoyer(v).then(function () {
        window.clearTimeout(minuterie);
        ecrire(BROUILLON, null);
        ecranMerci();
      }, function (raison) {
        envoi.disabled = false;
        envoi.textContent = "Envoyer mes réponses";
        if (raison === "ferme") { ecrire(BROUILLON, null); ecranFerme(); return; }
        statut.className = "q-statut erreur";
        statut.textContent = raison === "long"
          ? "Une réponse est trop longue : " + MAX.toLocaleString("fr-FR") + " caractères au plus par question."
          : "L'envoi n'a pas abouti. Vérifiez votre connexion, puis réessayez : vos réponses sont gardées.";
      });
    } }, [
      blocs,
      el("fieldset", { class: "q-question q-metiers" }, [
        el("legend", { class: "q-titre" }, [el("span", { text: "Votre métier, si vous voulez le dire" })]),
        el("p", { class: "q-aide", text: "Facultatif. Dans une petite équipe, il peut suffire à vous reconnaître." }),
        el("div", { class: "q-puces" }, choix)
      ]),
      el("div", { class: "q-envoi" }, [
        el("p", { class: "q-rappel", text: "Merci de ne citer ni client ni collègue par son nom." }),
        piege,
        envoi,
        statut
      ])
    ]);

    var date = JUSQU ? "Vous pouvez répondre jusqu'au " + jourMois(JUSQU) + "." : "";
    cadre([
      el("section", { class: "q-tete" }, [
        el("h1", { text: "Ce que vous voulez faire remonter à Orange" }),
        el("p", { class: "q-intro", text: "Nous préparons un échange avec Orange et voulons partir de ce que vous vivez au quotidien. Vos réponses seront lues ensemble pour choisir les sujets à porter auprès d'Orange. Une synthèse anonyme pourra être présentée à Orange." }),
        el("div", { class: "q-anonyme" }, [
          el("span", { class: "q-cadenas", "aria-hidden": "true" }, [cadenas()]),
          el("p", {}, [el("strong", { text: "Anonyme. " }), "Ce questionnaire ne vous demande ni votre nom ni votre adresse, et n'enregistre ni l'un ni l'autre. Seul le jour de votre réponse est gardé."])
        ]),
        el("p", { class: "q-consigne", text: "Répondez à ce que vous voulez : une seule question suffit. " + date })
      ]),
      form
    ]);
    QUESTIONS.forEach(function (q) { if (champs[q.cle].value) ajuster(champs[q.cle]); });
  }

  /* ---------- Envoi ---------- */

  function envoyer(v) {
    if (!C.url || !C.cle || !C.espace || typeof window.fetch !== "function") return Promise.reject("reseau");
    return window.fetch(C.url.replace(/\/+$/, "") + "/rest/v1/rpc/deposer_remontee", {
      method: "POST",
      headers: { "apikey": C.cle, "Content-Type": "application/json", "Prefer": "return=minimal" },
      body: JSON.stringify({ p_espace: C.espace, p_reponses: v.reponses, p_metier: v.metier || null }),
      credentials: "omit",
      cache: "no-store",
      referrerPolicy: "no-referrer"
    }).then(function (res) {
      if (res.ok) return true;
      return res.json().catch(function () { return {}; }).then(function (err) {
        var m = String((err && err.message) || ""), c = String((err && err.code) || "");
        if (/ferm/i.test(m)) throw "ferme";
        if (c === "22001") throw "long";
        throw "reseau";
      });
    }, function () { throw "reseau"; });
  }

  /* ---------- Démarrage ---------- */

  function demarrer() {
    if (!ouvert()) { ecranFerme(); return; }
    var brouillon = null;
    try { brouillon = JSON.parse(lire(BROUILLON) || "null"); } catch (e) { brouillon = null; }
    ecranQuestionnaire(brouillon && typeof brouillon === "object" ? brouillon : {});
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", demarrer);
  else demarrer();
})();
</script>
