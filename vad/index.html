/* ======================================================================
   Une page plus légère : sections repliables, sommaire qui suit la lecture,
   personnes et sujets sur une ligne, message « Annuler », nouveautés,
   onglets en bas sur téléphone, bandeau court.
   ====================================================================== */
:root{--haut-barre:61px}

/* Le sommaire reste sous l'en-tête et marque la section en cours de lecture */
.sommaire.collant{position:sticky;top:var(--haut-barre);z-index:15;margin:-34px -28px -38px;padding:10px 28px;background:var(--verre);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid transparent;transition:border-color .2s}
.sommaire.collant.colle{border-bottom-color:var(--filet)}
.sommaire-lien.actif{background:var(--encre);border-color:var(--encre);color:var(--fond)}

/* Sections repliables : fermées, elles tiennent sur une ligne avec leur résumé */
.repliable h2{min-width:0}
.repli{display:inline-flex;align-items:center;gap:12px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;text-align:left;border-radius:4px}
.repli .chevron{flex:none;width:10px;height:10px}
.repli:hover .chevron{border-color:var(--encre)}
.repli-resume{font-size:14px;font-weight:500;color:var(--discret);padding-bottom:2px}
.section.fermee{gap:0}
.section.fermee > .titre{padding-bottom:14px;border-bottom:1px solid var(--filet);align-items:center}
.page > .section.fermee + .section.fermee,.page > .section.fermee + .duo-sections{margin-top:-30px}
.section-corps{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (prefers-reduced-motion:no-preference){.section-corps.deplie{animation:deplie .32s var(--ease) both}}
@keyframes deplie{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* Modifier : un bouton pour la page ; les « Modifier » de section n'apparaissent qu'au survol, sur ordinateur */
.bouton-edition svg{flex:none}
.bouton-edition.actif{background:var(--rose);border-color:var(--rose);color:var(--suie)}
.titre .lien-modifier:not(.actif){opacity:0;transition:opacity .15s}
.section:hover > .titre .lien-modifier,.section:focus-within > .titre .lien-modifier,.titre .lien-modifier:focus-visible,body.mode-edition .titre .lien-modifier{opacity:1}
@media (hover:none){body:not(.mode-edition) .titre .lien-modifier:not(.actif){display:none}}

/* Les personnes, une ligne chacune */
.personnes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--filet);border:1px solid var(--filet)}
.personnes > .personne:last-child:nth-child(odd){grid-column:1 / -1}
.personne{min-width:0;background:var(--papier)}
.personne-btn{width:100%;height:100%;display:flex;align-items:center;gap:14px;padding:12px 16px;text-align:left;transition:background .15s}
.personne-btn:hover{background:var(--pierre)}
.personne .mono{width:40px;height:40px;font-size:18px}
.personnes > li:nth-child(3n+2) .mono{background:var(--rose-teinte)}
.personnes > li:nth-child(3n) .mono{background:var(--vert-teinte)}
.personnes > .personne.moi .mono{background:var(--encre);color:var(--fond)}
.personne.moi{box-shadow:inset 4px 0 0 var(--rose)}
.personne-noms{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.personne-nom{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:15px;font-weight:700;line-height:1.25}
.personne-nom .neuf{margin:0}
.personne-sous{font-size:13.5px;line-height:1.4;color:var(--discret);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.personne-fleche{flex:none;display:grid;place-items:center;color:var(--discret);transition:transform .2s var(--ease)}
.personne-btn:hover .personne-fleche{transform:translateX(2px);color:var(--encre)}
.personne-modifier{flex:none;font-size:13px;font-weight:700;color:var(--attenue);text-decoration:underline;text-underline-offset:3px}

/* Sujets et questions : une ligne chacun, dans une seule carte */
.sujets{gap:0;background:var(--papier);border:1px solid var(--filet)}
.sujets > li + li{border-top:1px solid var(--filet)}
.ligne-sujet{position:relative;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 16px;padding:12px 16px 14px;text-align:left;transition:background .15s}
.ligne-sujet:hover{background:var(--pierre)}
.ls-corps{display:flex;flex-direction:column;gap:3px;min-width:0}
.ls-texte{font-size:14px;font-weight:700;line-height:1.38}
.ls-meta{font-size:13px;line-height:1.35;color:var(--discret)}
.ls-etat{font-weight:700;color:var(--rose-texte)}
.question.prete .ls-etat{color:var(--vert-texte)}
.ls-score{display:flex;align-items:center;gap:8px;white-space:nowrap}
.ls-points{font-size:13px;color:var(--attenue)}
.ls-points strong{font-family:var(--titre);font-size:21px;font-weight:600;line-height:1;color:var(--encre)}
.ls-score .mon-rang{font-size:12px;font-weight:700;padding:3px 8px}
.ligne-sujet .sujet-barre{position:absolute;left:0;right:0;bottom:0;height:3px;background:transparent}
.statut-retenu .ligne-sujet,.question.prete .ligne-sujet{box-shadow:inset 4px 0 0 var(--vert)}
.statut-ecarte .ls-texte{text-decoration:line-through;text-decoration-color:var(--discret);color:var(--discret)}

/* Ce qui a changé depuis la dernière visite */
.neuf{display:inline-block;flex:none;width:8px;height:8px;margin:0 8px 0 0;border-radius:50%;background:var(--rose);vertical-align:.12em}
.nouveautes{display:flex;align-items:baseline;gap:10px;font-size:14px;line-height:1.55;color:var(--attenue);text-wrap:pretty}
.nouveautes > .neuf{margin:0;transform:translateY(-1px)}
.nv-lien{font-weight:700;color:var(--encre);text-decoration:underline;text-decoration-color:var(--rose);text-decoration-thickness:2px;text-underline-offset:3px}
.nv-lien:hover{text-decoration-thickness:3px}

/* Le message du bas */
.annonces{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));z-index:60;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.annonce{pointer-events:auto;display:flex;align-items:center;gap:6px 18px;max-width:560px;padding:11px 12px 11px 18px;background:var(--encre);color:var(--fond);font-size:14px;font-weight:500;line-height:1.4;box-shadow:4px 4px 0 var(--rose)}
.annonce-annuler{flex:none;padding:4px 6px;font-weight:700;color:inherit;text-decoration:underline;text-decoration-color:var(--rose);text-decoration-thickness:2px;text-underline-offset:3px;border-radius:4px}
.annonce-annuler:hover{text-decoration-thickness:3px}
.annonce.sort{opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s}
@media (prefers-reduced-motion:no-preference){.annonce{animation:annonce-monte .28s var(--ease) both}}
@keyframes annonce-monte{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* Téléphone : onglets en bas, sous le pouce ; bandeau d'accueil sur une bande */
@media screen and (max-width:759px){
  :root{--haut-barre:57px}
  /* L'effet verre de l'en-tête retiendrait la barre d'onglets en haut : sur téléphone, l'en-tête prend un fond plein */
  .barre{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--fond)}
  .sommaire.collant{margin:-22px -16px -26px;padding:10px 16px}
  .barre-int{flex-wrap:nowrap}
  .onglets{position:fixed;left:0;right:0;bottom:0;z-index:40;order:0;flex:none;margin:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0;padding:2px 4px env(safe-area-inset-bottom);background:var(--verre);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--filet)}
  .onglet{flex-direction:column;justify-content:center;gap:3px;min-height:56px;padding:6px 2px 5px;font-size:11.5px;line-height:1.1}
  .onglet svg{display:block;width:21px;height:21px;opacity:.85}
  .onglet.actif svg{opacity:1}
  .onglet::after{left:30%;right:30%;top:-2px;bottom:auto;height:3px}
  .onglet .long{display:none}
  .onglet .court{display:inline}
  .onglet-badge{position:absolute;top:4px;left:calc(50% + 5px);min-width:18px;height:16px;padding:0 5px;font-size:10.5px}
  body.en-saisie .onglets,body.feuille-ouverte .onglets{display:none}
  .page{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
  .annonces{bottom:calc(72px + env(safe-area-inset-bottom))}
  body.en-saisie .annonces{bottom:12px}
  .personnes{grid-template-columns:minmax(0,1fr)}
  .personnes > .personne:last-child:nth-child(odd){grid-column:auto}
  .personne-btn{padding:11px 14px;gap:12px}
  .page > .section.fermee + .section.fermee,.page > .section.fermee + .duo-sections{margin-top:-18px}
  .repli-resume{font-size:13px}
  .nouveautes{font-size:13.5px}

  .banniere{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"titre compte" "sous sous" "stats stats" "but but" "actions actions";gap:0 14px;align-items:end;padding:20px 18px}
  .banniere-texte,.banniere-compte{display:contents}
  .banniere-sur{display:none}
  .banniere h1{grid-area:titre;font-size:clamp(34px,10vw,44px);margin-top:0;align-self:end}
  .banniere h1::after{margin-top:10px}
  .bn-jours{grid-area:compte;align-self:end;align-items:flex-end;text-align:right}
  .bn-compte{font-size:62px}
  .bn-compte-lib{font-size:12px}
  .banniere-sous{grid-area:sous;margin-top:14px;font-size:14px}
  .bn-stats{grid-area:stats;flex-direction:row;flex-wrap:wrap;gap:4px 18px;margin-top:12px;padding-top:12px;border-top:1.5px solid rgba(48,48,48,.2)}
  .bn-stat{flex-direction:row;align-items:baseline;justify-content:flex-start;gap:6px}
  .bn-stat-val{font-size:20px}
  .bn-stat-lib{margin-top:0;font-size:11.5px}
  .banniere-but{grid-area:but;margin-top:14px;font-size:14px;line-height:1.5;padding-left:12px}
  .banniere-actions{grid-area:actions;margin-top:16px;gap:10px 16px}
}

@media print{
  .annonces,.nouveautes,.neuf,.personne-fleche,.repli-resume{display:none !important}
  .personnes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .personne-sous{display:block;-webkit-line-clamp:unset;overflow:visible}
  .page > .section.fermee + .section.fermee,.page > .section.fermee + .duo-sections{margin-top:0}
}
/* Connexion par lien et code, avant l'ouverture de l'espace : une carte sur ses feuillets, les trois bandes dans l'angle */
body.hors-session #app{display:none}
body.hors-session{background:var(--fond)}
body.hors-session::after{content:"";position:fixed;right:-6px;bottom:-2px;z-index:0;width:min(440px,62vw);aspect-ratio:300 / 120;background:var(--triade) no-repeat right bottom / contain;pointer-events:none}
.connexion{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:40px 16px 150px}
.connexion-carte{--f1:6px;--f2:12px;--f3:18px;position:relative;width:min(480px,calc(100% - 18px));margin:0 18px 18px 0;background:var(--papier);border:1px solid var(--filet);padding:38px 40px 34px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--f1) var(--f1) 0 #FF97CA,var(--f2) var(--f2) 0 #6490FF,var(--f3) var(--f3) 0 #BDDB81}
.connexion-marque{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.connexion h1{font-size:50px;line-height:.92;margin-top:0}
.connexion h1::after{content:"";display:block;width:min(170px,60%);height:10px;margin-top:12px;background:var(--rose);-webkit-mask:var(--vague) no-repeat left center / contain;mask:var(--vague) no-repeat left center / contain}
.connexion-texte{color:var(--attenue);font-size:16px;line-height:1.5}
.connexion-form{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.connexion-lib{font-family:var(--titre);font-weight:600;font-size:16px;letter-spacing:.045em;text-transform:uppercase;color:var(--attenue)}
.connexion-champ{width:100%;font-size:17px;padding:14px 16px;border:1px solid var(--filet-2);border-radius:6px;background:var(--pierre);color:var(--encre);transition:border-color .15s,box-shadow .15s,background .15s}
.connexion-champ:focus{outline:none;border-color:var(--encre);background:var(--papier);box-shadow:0 0 0 3px var(--rose-teinte)}
.connexion-champ.code{font-family:var(--titre);font-weight:600;font-size:34px;letter-spacing:.3em;text-align:center;padding:10px 16px}
.connexion-bouton{margin-top:6px;border:0;border-radius:999px;padding:15px 18px;font-size:16px;font-weight:700;color:var(--papier-lusko);background:var(--suie);transition:background .15s,color .15s,transform .12s}
.connexion-bouton:hover{background:var(--rose);color:var(--suie)}
.connexion-bouton:active{transform:scale(.98)}
.connexion-bouton:disabled{opacity:.6;cursor:default;transform:none}
:root[data-theme="dark"] .connexion-bouton{background:var(--papier-lusko);color:var(--suie)}
:root[data-theme="dark"] .connexion-bouton:hover{background:var(--rose)}
a.connexion-bouton{display:block;text-align:center;text-decoration:none}
/* Sans accès ici mais invité dans un autre outil du site : le lien passe devant, « Changer d'adresse » s'efface */
.connexion-liens{display:flex;flex-direction:column;gap:4px}
.connexion-liens:empty{display:none}
.connexion-liens:not(:empty) + .connexion-bouton,:root[data-theme="dark"] .connexion-liens:not(:empty) + .connexion-bouton{background:none;color:var(--encre);box-shadow:inset 0 0 0 1.5px var(--encre)}
.connexion-liens:not(:empty) + .connexion-bouton:hover{background:var(--rose);color:var(--suie);box-shadow:inset 0 0 0 1.5px var(--rose)}
.connexion-note{border-radius:6px;padding:13px 15px;font-size:15px;line-height:1.45}
.connexion-note.succes{background:var(--vert-teinte);color:var(--vert-texte);box-shadow:inset 4px 0 0 var(--vert)}
.connexion-note.erreur{background:var(--rouge-teinte);color:var(--rouge-texte);box-shadow:inset 4px 0 0 var(--rouge)}
.connexion-erreurs:empty{display:none}
.connexion-petit{font-size:13.5px;color:var(--discret);line-height:1.5;margin-top:4px}
.connexion-lien{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--encre);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.connexion-lien:hover{text-decoration-color:var(--rose);text-decoration-thickness:3px}
.connexion-attente{display:flex;align-items:center;gap:12px;color:var(--attenue);font-size:15px;padding:8px 0}
.rond{width:18px;height:18px;border-radius:50%;border:2px solid var(--pierre);border-top-color:var(--rose);animation:tourne .8s linear infinite}
@media (prefers-reduced-motion:no-preference){
  .connexion-carte{animation:monte .6s var(--ease) both,feuillets-carte .7s var(--ease) .3s backwards}
  .connexion h1::after{animation:ondule 1.1s var(--ease) .35s both}
  body.hors-session::after{animation:glisse-angle .9s var(--ease) .2s both}
}
@keyframes feuillets-carte{from{box-shadow:0 0 0 #FF97CA,0 0 0 #6490FF,0 0 0 #BDDB81}to{box-shadow:var(--f1) var(--f1) 0 #FF97CA,var(--f2) var(--f2) 0 #6490FF,var(--f3) var(--f3) 0 #BDDB81}}
@keyframes glisse-angle{from{opacity:0;transform:translate(80px,60px)}to{opacity:1;transform:none}}
@media (max-width:520px){
  .connexion{place-items:start center;padding-top:7vh;padding-bottom:120px}
  .connexion-carte{--f1:4px;--f2:8px;--f3:12px;padding:28px 22px 24px;margin:0 12px 12px 0;width:calc(100% - 12px)}
  .connexion h1{font-size:42px}
}

/* Copilote VAD : la même charte que l'espace projet (aplats nets, capitales étroites, rose pour l'essentiel,
   bleu pour l'action, vert pour ce qui est fait), resserrée pour un outil qu'on garde ouvert toute la journée. */

.page{gap:40px;padding-top:26px}
.page .sous-titre{padding:0}
.page-tete{margin-bottom:-12px}
.page-tete h1{font-size:clamp(40px,4.6vw,60px)}
.page-actions{gap:10px 14px}
.note-discrete,.feuille-intro{font-size:13.5px;line-height:1.5;color:var(--discret);text-wrap:pretty}
.feuille-intro{margin:6px 0 4px;font-size:14px}
.marque-bu{color:var(--encre)}
.bouton.petit{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;font-size:13.5px;white-space:nowrap}
.bouton.large{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 20px}
.bouton.fort{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;font-size:15px;background:var(--suie);color:var(--papier-lusko);box-shadow:4px 4px 0 var(--rose)}
.bouton.fort:hover{background:var(--rose);color:var(--suie);box-shadow:4px 4px 0 var(--suie)}
:root[data-theme="dark"] .bouton.fort{background:var(--papier-lusko);color:var(--suie)}
.bouton svg,.bouton-clair svg{flex:none}
.feuille.large{width:min(720px,100%)}
.trois{display:grid;grid-template-columns:1fr;gap:0 12px}
@media (min-width:620px){.trois{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lien-carte{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;padding:2px 0;white-space:nowrap}
.lien-carte:hover span{text-decoration:underline;text-decoration-color:var(--rose);text-decoration-thickness:3px;text-underline-offset:4px}
.lien-carte svg{transition:transform .2s var(--ease)}
.lien-carte:hover svg{transform:translateX(3px)}

/* Un appel en cours : un point rose sur l'onglet */
.onglet-direct{width:8px;height:8px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 3px var(--rose-teinte)}
@media (prefers-reduced-motion:no-preference){.onglet-direct{animation:pouls 1.6s ease-in-out infinite}}
@keyframes pouls{50%{box-shadow:0 0 0 6px transparent}}

/* Étiquettes et états : jamais la couleur seule, toujours un mot */
.etiqs{display:flex;flex-wrap:wrap;gap:5px 6px}
.etiqs:empty{display:none}
.etiq{display:inline-flex;align-items:center;min-height:22px;padding:1px 9px;border-radius:11px;background:var(--pierre);font-size:12px;font-weight:700;line-height:1.3;color:var(--attenue);white-space:nowrap}
.etiq.etape-r1p,.etiq.etape-r2{background:var(--bleu-teinte);color:var(--bleu-texte)}
.etiq.etape-rappel{background:var(--rose-teinte);color:var(--rose-texte)}
.etiq.etape-signe{background:var(--vert-teinte);color:var(--vert-texte)}
.etiq.etape-perdu{background:none;box-shadow:inset 0 0 0 1px var(--filet-2);color:var(--discret)}
.etiq.rouge{background:var(--rouge-teinte);color:var(--rouge-texte)}
.etiq.scenario{background:var(--suie);color:var(--papier-lusko)}
:root[data-theme="dark"] .etiq.scenario{background:var(--papier-lusko);color:var(--suie)}
.statut{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;line-height:1.3}
.statut svg{flex:none}
.statut.bon{color:var(--vert-texte)}
.statut.mauvais{color:var(--rouge-texte)}
.statut.neutre{color:var(--attenue)}

/* La jauge : la part faite, et le repère d'un seuil */
.vjauge{position:relative;display:block;height:10px;background:var(--pierre)}
.vjauge i{display:block;height:100%;background:var(--rose);transform-origin:left center}
.vjauge.plafond i{background:var(--bleu)}
.vjauge b{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--encre)}
@media (prefers-reduced-motion:no-preference){.page.entree .vjauge i{animation:remplit 1s var(--ease) .25s both}}

/* ---------- Ma journée ---------- */

.chiffres-jour{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1.5px solid var(--encre);border-bottom:1px solid var(--filet)}
.chiffre{display:flex;flex-direction:column;gap:2px;padding:14px 16px 13px;border-left:1px solid var(--filet);min-width:0}
.chiffre:first-child{border-left:0;padding-left:0}
.chiffre strong{font-family:var(--titre);font-weight:600;font-size:42px;line-height:.95;letter-spacing:.01em}
.chiffre-lib{font-size:13.5px;font-weight:700}
.chiffre-sous{font-size:12.5px;color:var(--discret);line-height:1.35}
.bandeau-mois{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) auto;align-items:start;gap:16px 28px;padding:18px 22px;background:var(--papier);border:1px solid var(--filet);box-shadow:inset 4px 0 0 var(--rose)}
.bandeau-mois.attente{grid-template-columns:1fr auto;align-items:center}
.bm-marge,.bm-taux{display:flex;flex-direction:column;gap:6px;min-width:0}
.bm-lib{font-family:var(--titre);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--discret)}
.bm-valeur{font-size:14px;color:var(--attenue)}
.bm-valeur strong{font-family:var(--titre);font-weight:600;font-size:34px;line-height:.95;color:var(--encre)}
.bm-sous{font-size:13px;color:var(--attenue)}
.bandeau-mois .lien-carte{align-self:center}
.jour-grille{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:40px 36px;align-items:start}
.jour-colonne{display:flex;flex-direction:column;gap:36px;min-width:0}
.jour-colonne.cote{position:sticky;top:calc(var(--haut-barre) + 20px)}

.contacts{display:flex;flex-direction:column;border-top:1px solid var(--filet)}
.contact{position:relative;display:grid;grid-template-columns:104px minmax(0,1fr) auto;align-items:center;gap:6px 16px;padding:13px 0 13px;border-bottom:1px solid var(--filet)}
.contact.retard::before,.fiche-ligne.retard::before,.vente-ligne.annulee::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:4px;background:var(--rouge)}
.contact-quand{display:flex;flex-direction:column;gap:1px}
.contact-quand strong{font-family:var(--titre);font-weight:600;font-size:25px;line-height:1}
.contact-quand span{font-size:12.5px;color:var(--discret);line-height:1.3}
.contact.retard .contact-quand span{color:var(--rouge-texte);font-weight:700}
.contact-qui{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.contact-nom{font-size:15.5px;font-weight:700;text-align:left;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;transition:text-decoration-color .15s}
.contact-nom:hover{text-decoration-color:var(--rose);text-decoration-thickness:2px}
.contact-details{font-size:13.5px;color:var(--attenue);overflow-wrap:anywhere}
.contacts.plus-tard .contact-quand strong{font-size:15px;font-family:var(--sans);font-weight:700;line-height:1.25}
.vide-contacts{padding:22px 0;border-top:1px solid var(--filet);border-bottom:1px solid var(--filet);color:var(--attenue);font-size:14.5px;text-wrap:pretty}
#bloc-contacts .sous-titre{margin-top:10px}

/* La session de prospection : le bloc de saisie sur ses feuillets bleu et vert */
.bloc-session{gap:14px}
.session{--f1:5px;--f2:10px;display:flex;flex-direction:column;gap:16px;padding:20px 20px 18px;margin:0 10px 10px 0;background:var(--papier);border:1px solid var(--filet-2);box-shadow:var(--f1) var(--f1) 0 var(--bleu),var(--f2) var(--f2) 0 var(--vert)}
.session-scenario{display:flex;align-items:center;justify-content:space-between;gap:10px}
.session-scenario .champ-lib{font-family:var(--titre);font-weight:600;text-transform:uppercase;letter-spacing:.045em;font-size:13.5px}
.session-scenario select{max-width:62%}
.session-question{font-size:17px;font-weight:700;line-height:1.3}
.session-chemin{font-weight:500;color:var(--discret)}
.session-choix{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.choix{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;background:var(--fond);border:1.5px solid var(--encre);font-size:15px;font-weight:700;line-height:1.25;text-align:left;transition:background .12s,color .12s,transform .1s}
.choix:hover,.choix:focus-visible{background:var(--rose);border-color:var(--rose);color:var(--suie)}
.choix:active{transform:scale(.98)}
.choix.guide{grid-column:1 / -1;background:var(--suie);color:var(--papier-lusko);border-color:var(--suie)}
:root[data-theme="dark"] .choix.guide{background:var(--papier-lusko);color:var(--suie);border-color:var(--papier-lusko)}
.choix.guide:hover{background:var(--rose);border-color:var(--rose);color:var(--suie)}
.touche,.session-aide kbd{flex:none;display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 5px;border-radius:4px;border:1px solid currentColor;font-family:var(--sans);font-size:12.5px;font-weight:700;line-height:1;opacity:.85}
.session-aide{margin-top:12px;font-size:13px;color:var(--discret)}
.session-aide kbd{min-width:20px;height:20px;font-size:11.5px;vertical-align:1px}
.derniers{display:flex;flex-direction:column;border-top:1px solid var(--filet)}
.dernier{display:grid;grid-template-columns:62px auto minmax(0,1fr);gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--filet);font-size:13.5px}
.dernier-heure{color:var(--discret);font-variant-numeric:tabular-nums}
.dernier-issue{font-weight:700}
.dernier-issue.discret{font-weight:500;color:var(--attenue)}
.dernier-qui{color:var(--attenue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- L'appel guidé ---------- */

.vue-appel{gap:22px;padding-top:0}
.appel-bandeau{position:sticky;top:var(--haut-barre);z-index:14;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin:0 -28px;padding:18px 28px 14px;background:var(--verre);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid var(--filet)}
.ab-qui{display:flex;flex-direction:column;gap:5px;min-width:0}
.ab-nature{font-family:var(--titre);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--rose-texte)}
.ab-nom{font-size:clamp(30px,3.4vw,42px);line-height:.95;overflow-wrap:anywhere}
.ab-details{font-size:14px;color:var(--attenue);display:flex;flex-wrap:wrap;gap:4px 14px}
.ab-tel{font-weight:700;color:var(--encre);text-decoration:underline;text-decoration-color:var(--rose);text-decoration-thickness:2px;text-underline-offset:3px}
.ab-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.chrono{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--attenue)}
.appel-grille{display:grid;grid-template-columns:216px minmax(0,1fr);gap:36px;align-items:start}
.conducteur{position:sticky;top:calc(var(--haut-barre) + var(--haut-bandeau,118px) + 18px)}
.conducteur ol{display:flex;flex-direction:column;gap:2px;counter-reset:none}
.cd-etape{width:100%;display:flex;align-items:center;gap:12px;padding:8px 10px 8px 8px;font-size:14.5px;font-weight:600;color:var(--attenue);transition:background .12s,color .12s}
.cd-etape:hover{background:var(--survol);color:var(--encre)}
.cd-num{flex:none;width:28px;height:28px;display:grid;place-items:center;border:1.5px solid var(--filet-2);font-family:var(--titre);font-size:16px;font-weight:600;color:var(--attenue)}
.cd-etape.vu .cd-num{border-color:var(--vert);background:var(--vert);color:var(--suie)}
.cd-etape.actuel{background:var(--rose-teinte);color:var(--encre);font-weight:800}
.cd-etape.actuel .cd-num{border-color:var(--rose);background:var(--rose);color:var(--suie)}
.cd-lib{flex:1;text-align:left}
.cd-info{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:9px;background:var(--pierre);color:var(--attenue)}
.etape-corps{display:flex;flex-direction:column;gap:16px;min-width:0;outline:none;padding-bottom:12px}
.etape-tete{display:flex;flex-direction:column;gap:4px;margin-bottom:2px}
.etape-tete h2{font-size:clamp(30px,3vw,38px)}
.etape-tete h2::before{content:"";display:inline-block;width:.62em;height:.62em;margin-right:.36em;vertical-align:.02em;border-radius:2px;background:var(--rose) var(--fleche) center / 78% no-repeat}
.etape-sous{font-size:15px;color:var(--attenue);max-width:68ch;text-wrap:pretty}
.etape-pied{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding-top:18px;border-top:1px solid var(--filet)}
.etape-pied .bouton{display:inline-flex;align-items:center;gap:8px}

.scenarios{display:flex;flex-wrap:wrap;gap:8px}
.scenario-btn,.seg-btn{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 14px;border-radius:18px;border:1.5px solid var(--filet-2);background:var(--papier);font-size:13.5px;font-weight:600;transition:background .12s,border-color .12s,color .12s}
.scenario-btn:hover,.seg-btn:hover{border-color:var(--encre)}
.scenario-btn.actif,.seg-btn.actif{background:var(--encre);border-color:var(--encre);color:var(--fond);font-weight:700}
.seg-n{font-size:12px;font-weight:700;opacity:.7}
.segments.compacts{display:flex;flex-wrap:wrap;gap:8px}

.carte-script{display:flex;flex-direction:column;gap:8px;padding:16px 20px;background:var(--papier);border:1px solid var(--filet)}
.carte-script.principal{border-color:var(--filet-2);box-shadow:inset 4px 0 0 var(--rose);padding:20px 24px}
.carte-script.discret{background:none;border-style:dashed}
.carte-script.rouge{box-shadow:inset 4px 0 0 var(--rouge);background:var(--rouge-teinte);border-color:transparent}
.cs-titre{font-family:var(--titre);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--discret)}
.script-texte{font-size:16px;line-height:1.55;text-wrap:pretty}
.script-texte.grand{font-size:clamp(18px,1.6vw,21px);line-height:1.5}
.script-texte.petit{font-size:14px;line-height:1.5;color:var(--attenue)}
.script-texte mark.rempli{background:var(--rose-teinte);color:inherit;padding:0;border-radius:1px;box-shadow:-2px 0 0 var(--rose-teinte),2px 0 0 var(--rose-teinte);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.trou{color:var(--bleu-texte);font-weight:600;text-decoration:underline dotted;text-decoration-thickness:2px;text-underline-offset:4px}
button.trou{font:inherit;font-weight:600;padding:0 2px;border-radius:3px}
button.trou:hover{background:var(--bleu-teinte)}
.cs-conseil{font-size:13.5px;line-height:1.5;color:var(--attenue);padding-left:14px;border-left:2px solid var(--filet-2);text-wrap:pretty}
.points{display:flex;flex-direction:column;gap:8px}
.points > li{position:relative;padding-left:20px;font-size:15px;line-height:1.5}
.points > li::before{content:"";position:absolute;left:0;top:.5em;width:9px;height:9px;border-radius:2px;background:var(--rose)}

.decideur{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.decideur .champ-lib{font-family:var(--titre);font-weight:600;text-transform:uppercase;letter-spacing:.045em;font-size:13.5px}
.axes-onglets{display:flex;flex-wrap:wrap;gap:0;border-bottom:1.5px solid var(--encre)}
.axe-onglet{position:relative;display:inline-flex;align-items:center;gap:8px;padding:11px 16px 10px;font-size:14.5px;font-weight:600;color:var(--attenue)}
.axe-onglet:hover{color:var(--encre);background:var(--survol)}
.axe-onglet.actif{background:var(--encre);color:var(--fond);font-weight:700}
.axe-onglet.rempli::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--vert)}
.axe-prio{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:8px;background:var(--rose);color:var(--suie)}
.axe-panneau{display:flex;flex-direction:column;gap:14px;padding:18px 0 4px}
.spins{display:flex;flex-direction:column;gap:12px}
.spin{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start}
.spin-lettre{width:34px;height:34px;display:grid;place-items:center;background:var(--bleu-teinte);color:var(--bleu-texte);font-family:var(--titre);font-weight:600;font-size:20px}
.spin-lettre.petite{display:inline-grid;width:22px;height:22px;font-size:14px;margin-right:8px;vertical-align:-4px}
.spin-lib{font-family:var(--titre);font-weight:600;font-size:13.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--discret)}
.spin-q{font-size:15.5px}
.axe-champs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 12px}
.axe-champs .champ,.decouverte-cle .champ,.issue-details .champ{margin:6px 0}
.case-lib.prio{font-weight:700}
.decouverte-cle{display:flex;flex-direction:column;gap:2px;padding:18px 20px 12px;background:var(--fond-2);border:1px solid var(--filet)}
.apercu-reformulation{--f1:5px;--f2:10px;display:flex;flex-direction:column;gap:6px;padding:16px 20px;margin:0 10px 10px 0;background:var(--papier);border:1px solid var(--filet-2);box-shadow:var(--f1) var(--f1) 0 var(--rose),var(--f2) var(--f2) 0 var(--bleu)}
.apercu-reformulation .script-texte{font-size:16.5px}
.reformulation{--f1:6px;--f2:12px;--f3:18px;padding:28px 30px;margin:4px 18px 18px 0;background:var(--papier);border:1px solid var(--filet-2);box-shadow:var(--f1) var(--f1) 0 var(--rose),var(--f2) var(--f2) 0 var(--bleu),var(--f3) var(--f3) 0 var(--vert)}
.reformulation .script-texte.grand{font-size:clamp(21px,2.2vw,27px);line-height:1.45}
.reformulation-actions{display:flex;flex-wrap:wrap;gap:12px}
.reformulation-actions .bouton{display:inline-flex;align-items:center;gap:8px}

.silence{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-top:4px}
.silence .bouton{display:inline-flex;align-items:center;gap:8px}
.silence-compte{position:relative;width:64px;height:64px;flex:none;display:grid;place-items:center}
.silence-anneau{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--rose) var(--p,100%),var(--pierre) 0);-webkit-mask:radial-gradient(circle,transparent 55%,#000 56%);mask:radial-gradient(circle,transparent 55%,#000 56%)}
.silence-anneau.anime{animation:silence 7s linear forwards}
@property --p{syntax:"<percentage>";inherits:false;initial-value:100%}
@keyframes silence{from{--p:100%}to{--p:0%}}
.silence-n{position:relative;font-family:var(--titre);font-weight:600;font-size:28px;line-height:1}
.silence-texte{flex:1 1 220px;font-size:16px;font-weight:700;line-height:1.4}

.filtres-cat{display:flex;flex-wrap:wrap;gap:8px}
.objections{display:flex;flex-direction:column;border-top:1px solid var(--filet)}
.objection{border-bottom:1px solid var(--filet)}
.obj-tete{width:100%;display:grid;grid-template-columns:96px minmax(0,1fr) auto;align-items:baseline;gap:6px 14px;padding:13px 4px;text-align:left;transition:background .12s}
.obj-tete:hover{background:var(--survol)}
.obj-cat{font-family:var(--titre);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--discret)}
.obj-texte{font-size:15.5px;font-weight:700;line-height:1.4}
.obj-vu{font-size:12px;font-weight:700;color:var(--vert-texte)}
.objection.ouverte{background:var(--papier);box-shadow:inset 4px 0 0 var(--rose)}
.objection.ouverte .obj-tete{padding-left:18px}
.obj-corps{display:flex;flex-direction:column;gap:10px;padding:0 20px 18px 128px}

.temperature-conseil{font-size:17px;font-weight:700;line-height:1.45;padding:14px 18px;background:var(--papier);box-shadow:inset 4px 0 0 var(--rose);border:1px solid var(--filet)}
.seg-btn.temp-froid.actif{background:var(--bleu);border-color:var(--bleu);color:var(--suie)}
.seg-btn.temp-tiede.actif{background:var(--orange);border-color:var(--orange);color:var(--suie)}
.seg-btn.temp-chaud.actif{background:var(--rose);border-color:var(--rose);color:var(--suie)}
.closings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.rappels-conclusion{display:flex;flex-direction:column;gap:6px;padding:14px 18px;background:var(--fond-2);border:1px solid var(--filet)}
.issues{display:flex;flex-wrap:wrap;gap:8px}
.issue-btn{min-height:44px;padding:9px 16px;border:1.5px solid var(--encre);background:var(--papier);font-size:14.5px;font-weight:700;transition:background .12s,color .12s}
.issue-btn:hover{background:var(--rose-teinte)}
.issue-btn.actif{background:var(--encre);color:var(--fond)}
.issue-btn.vente.actif{background:var(--vert);border-color:var(--vert);color:var(--suie)}
.issue-details{display:flex;flex-direction:column;gap:4px;padding:14px 18px;background:var(--papier);border:1px solid var(--filet)}
.vente-form{display:flex;flex-direction:column;gap:8px}
.vente-form .case-lib{font-size:14.5px}
.cases-appel{display:flex;flex-wrap:wrap;gap:10px 28px}

.vue-appel .page-tete{margin-top:6px}
.choix-fiches{display:flex;flex-direction:column;border-top:1px solid var(--filet)}
.choix-fiche{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nom fleche" "info fleche";align-items:center;gap:2px 12px;padding:12px 6px;border-bottom:1px solid var(--filet);text-align:left;transition:background .12s}
.choix-fiche:hover{background:var(--survol)}
.choix-fiche strong{grid-area:nom;font-size:15px}
.choix-fiche span{grid-area:info;font-size:13.5px;color:var(--attenue)}
.choix-fiche svg{grid-area:fleche}

/* ---------- Fiches ---------- */

.fiches-outils{display:flex;flex-direction:column;gap:10px}
.fiches-outils .champ{margin:0;max-width:520px}
.fiches-liste{display:flex;flex-direction:column;border-top:1px solid var(--filet);margin-top:-16px}
.fiche-ligne{position:relative;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(150px,.8fr) auto;align-items:center;gap:8px 18px;padding:11px 0;border-bottom:1px solid var(--filet)}
.fl-qui{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-width:0}
.fl-qui strong{font-size:15px;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px}
.fl-qui:hover strong{text-decoration-color:var(--rose);text-decoration-thickness:2px}
.fl-qui span{font-size:13px;color:var(--attenue);overflow-wrap:anywhere}
.fl-etape{display:flex;flex-wrap:wrap;gap:5px}
.fl-quand{font-size:13.5px;color:var(--attenue)}
.fl-quand.retard{color:var(--rouge-texte);font-weight:700}
.annuaire{display:flex;flex-direction:column;gap:6px;margin:10px 0 6px;padding:14px 16px;background:var(--fond-2);border:1px solid var(--filet)}
.annuaire-ligne{display:flex;gap:8px}
.annuaire-ligne .saisie{flex:1}
.annuaire-liste{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.annuaire-choix{width:100%;display:flex;flex-direction:column;gap:1px;padding:9px 12px;background:var(--papier);border:1px solid var(--filet);text-align:left;transition:border-color .12s}
.annuaire-choix:hover{border-color:var(--encre)}
.annuaire-choix strong{font-size:14.5px}
.annuaire-choix span{font-size:12.5px;color:var(--attenue)}
.champ-aide.ok{color:var(--vert-texte);font-weight:700}
.champ-aide.erreur{color:var(--rouge-texte)}
.historique{margin-top:16px;padding-top:4px;border-top:1px solid var(--filet)}
.historique .sous-titre{padding:12px 0 6px}
.histo{display:flex;flex-direction:column}
.histo > li{display:grid;grid-template-columns:128px minmax(0,1fr);gap:2px 12px;padding:7px 0;border-bottom:1px solid var(--filet);font-size:13.5px}
.histo > li.vente .histo-texte{font-weight:700;color:var(--vert-texte)}
.histo-quand{color:var(--discret)}
.histo-note{grid-column:2;color:var(--attenue);white-space:pre-line}

/* ---------- Résultats ---------- */

.choix-mois{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--encre);border-radius:999px;padding:3px}
.mois-fleche{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;transition:background .12s}
.mois-fleche:hover:not(:disabled){background:var(--rose)}
.mois-fleche:disabled{opacity:.3;cursor:default}
.mois-lib{min-width:142px;text-align:center;font-size:14.5px;font-weight:700}
.case-lib.discret{font-size:13.5px;font-weight:600;color:var(--attenue)}
.tuiles{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr) minmax(0,1fr);gap:16px}
.tuiles.quatre{grid-template-columns:repeat(4,minmax(0,1fr))}
.tuile{display:flex;flex-direction:column;gap:9px;padding:18px 20px;background:var(--papier);border:1px solid var(--filet);min-width:0}
.tuile.hero{--f1:6px;--f2:12px;margin:0 12px 12px 0;border-color:var(--filet-2);box-shadow:var(--f1) var(--f1) 0 var(--bleu),var(--f2) var(--f2) 0 var(--vert)}
.tuile-lib{font-family:var(--titre);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--discret)}
.tuile-valeur{font-size:15px;color:var(--attenue);line-height:1.1}
.tuile-valeur strong{font-family:var(--titre);font-weight:600;font-size:44px;line-height:.92;color:var(--encre)}
.tuile.hero .tuile-valeur strong{font-size:60px}
.tuile.petite .tuile-valeur strong{font-size:32px}
.tuile-sous{font-size:13.5px;color:var(--attenue);line-height:1.45;text-wrap:pretty}
.tuile-sous.fort{color:var(--encre);font-weight:700}
.efficacite{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px 40px;align-items:start}
.entonnoir{display:flex;flex-direction:column;gap:10px}
.ent-ligne{display:grid;grid-template-columns:170px minmax(0,1fr) 150px;align-items:center;gap:14px}
.ent-lib{font-size:14px;font-weight:600}
.ent-barre{display:block;height:20px}
.ent-barre i{display:block;height:100%;min-width:2px;background:var(--bleu);border-radius:0 4px 4px 0}
.ent-val{display:flex;flex-direction:column;gap:0;line-height:1.2}
.ent-val strong{font-size:17px}
.ent-val span{font-size:12.5px;color:var(--discret)}
.rdv-chiffres{display:flex;flex-direction:column;border-top:1.5px solid var(--encre)}
.rdv-chiffres > div{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--filet)}
.rdv-chiffres dt{font-size:14px;color:var(--attenue)}
.rdv-chiffres dd{font-size:17px;font-weight:700}
.courbe-zone{position:relative}
.courbe{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.courbe .grille{stroke:var(--filet);stroke-width:1}
.courbe .axe{fill:var(--discret);font-family:var(--sans);font-size:12px}
.courbe .rythme{fill:none;stroke:var(--discret);stroke-width:1.5}
.courbe .realise{fill:none;stroke:var(--bleu-texte);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
:root[data-theme="dark"] .courbe .realise{stroke:var(--bleu)}
.courbe .aire{fill:var(--bleu);opacity:.1}
.courbe .point{fill:var(--bleu-texte);stroke:var(--fond);stroke-width:2}
:root[data-theme="dark"] .courbe .point{fill:var(--bleu)}
.courbe .curseur{stroke:var(--encre);stroke-width:1}
.courbe .etiquette-courbe{fill:var(--attenue);font-family:var(--sans);font-size:12px;font-weight:600}
.bulle{position:absolute;top:0;width:170px;display:flex;flex-direction:column;gap:2px;padding:9px 12px;background:var(--encre);color:var(--fond);font-size:12.5px;line-height:1.35;pointer-events:none;box-shadow:3px 3px 0 var(--rose)}
.bulle strong{font-size:16px}
.detail-donnees summary{cursor:pointer;font-size:13.5px;font-weight:700;padding:6px 0;width:max-content}
.table-donnees,.table-equipe{width:100%;border-collapse:collapse;font-size:13.5px}
.table-donnees th,.table-donnees td,.table-equipe th,.table-equipe td{padding:8px 10px;border-bottom:1px solid var(--filet);text-align:left;white-space:nowrap}
.table-donnees thead th,.table-equipe thead th{font-family:var(--titre);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--discret);border-bottom:1.5px solid var(--encre)}
.table-donnees td,.table-equipe .num{text-align:right;font-variant-numeric:tabular-nums}
.table-equipe tbody th{font-weight:700;font-size:14.5px}
.table-equipe tr.moi th{box-shadow:inset 4px 0 0 var(--rose);padding-left:14px}
.table-equipe th,.table-equipe td{vertical-align:middle}
.table-equipe .vjauge{display:inline-block;width:64px;height:7px;vertical-align:middle}
.table-equipe .statut{justify-content:flex-end;font-size:13px}
.table-defile{overflow-x:auto;margin:0 -4px;padding:0 4px}
.ventes{display:flex;flex-direction:column;border-top:1px solid var(--filet)}
.vente-ligne{position:relative;display:grid;grid-template-columns:104px minmax(0,1fr) auto;align-items:center;gap:6px 16px;padding:11px 0;border-bottom:1px solid var(--filet)}
.vl-date{font-size:13.5px;color:var(--discret)}
.vl-qui{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-width:0}
.vl-qui strong{font-size:15px;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px}
.vl-qui:hover strong{text-decoration-color:var(--rose);text-decoration-thickness:2px}
.vl-qui span{font-size:13px;color:var(--attenue)}
.vl-marge{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-variant-numeric:tabular-nums}
.vl-marge strong{font-size:16px}
.vl-marge span{font-size:12px;color:var(--rouge-texte)}

/* ---------- Scripts ---------- */

.vue-scripts .sommaire{margin-top:2px}
.scripts-grille{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.script-carte{display:flex;flex-direction:column;gap:12px;padding:18px 20px;background:var(--papier);border:1px solid var(--filet);min-width:0}
.sc-tete{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sc-tete h3{font-family:var(--titre);font-weight:600;font-size:22px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em}
.sc-angle{font-size:14px;color:var(--attenue);text-wrap:pretty}
.sc-textes{display:flex;flex-direction:column;gap:12px}
.sc-textes dt{font-family:var(--titre);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--discret);margin-bottom:3px}
.lecture-script{font-size:14.5px;line-height:1.55}
.objections-groupes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 32px}
.obj-groupe{display:flex;flex-direction:column;gap:8px}
.obj-liste{display:flex;flex-direction:column;border-top:1.5px solid var(--encre)}
.obj-item{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--filet)}
.obj-item .obj-texte{font-size:15px}

/* ---------- Le mur : sur un écran du plateau, en grand, sur fond suie ---------- */

body.vue-mur{
  --fond:#303030;--fond-2:#363636;--papier:#3A3A3A;--pierre:#4A4A4A;--encre:#FFFDF8;--attenue:#DAD6CD;--discret:#C2BEB5;
  --filet:#4E4E4E;--filet-2:#666666;--vert-texte:#C8E296;--rouge-texte:#FF9488;--rose-teinte:#5A4350;--logo:var(--logo-clair);
  background:#303030;color:#FFFDF8;color-scheme:dark
}
.mur{min-height:100vh;display:flex;flex-direction:column;gap:clamp(14px,1.7vw,30px);padding:clamp(16px,1.8vw,34px) clamp(18px,3vw,56px) clamp(16px,1.8vw,30px)}
.mur-tete{display:flex;align-items:center;gap:18px 24px;flex-wrap:wrap}
.mur-tete .logo{height:clamp(26px,2.4vw,40px)}
.mur-titre{font-family:var(--titre);font-weight:600;font-size:clamp(22px,2.2vw,36px);text-transform:uppercase;letter-spacing:.03em;color:var(--attenue)}
.mur-titre strong{color:var(--encre)}
.mur-heure{margin-left:auto;font-family:var(--titre);font-weight:600;font-size:clamp(28px,3vw,52px);line-height:1}
.mur-quitter{font-size:13.5px;font-weight:700;padding:8px 14px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--filet-2);color:var(--attenue)}
.mur-quitter:hover{box-shadow:inset 0 0 0 1.5px var(--encre);color:var(--encre)}
.mur-hero{display:flex;flex-direction:column;gap:10px}
.mur-lib{font-family:var(--titre);font-weight:600;font-size:clamp(16px,1.4vw,24px);letter-spacing:.06em;text-transform:uppercase;color:var(--discret)}
.mur-montant{font-size:clamp(20px,2vw,34px);color:var(--attenue);line-height:1}
.mur-montant strong{font-family:var(--titre);font-weight:600;font-size:clamp(64px,7.4vw,142px);line-height:.85;color:var(--encre)}
.mur-hero .vjauge{height:clamp(12px,1.2vw,22px);background:#4A4A4A}
.mur-sous{font-size:clamp(15px,1.3vw,22px);color:var(--attenue)}
.mur-tuiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.6vw,28px)}
.mur-tuile{display:flex;flex-direction:column;gap:6px;padding:clamp(12px,1.1vw,20px) clamp(14px,1.3vw,24px);border-top:3px solid var(--rose);background:#363636}
.mur-tuile:nth-child(2){border-top-color:var(--bleu)}
.mur-tuile:nth-child(3){border-top-color:var(--vert)}
.mur-tuile:nth-child(4){border-top-color:#FFFDF8}
.mur-val{font-family:var(--titre);font-weight:600;font-size:clamp(38px,3.9vw,74px);line-height:.9}
.mur .statut{font-size:clamp(14px,1.2vw,20px)}
.mur-equipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:clamp(12px,1.6vw,28px)}
.mur-conseiller{display:flex;flex-direction:column;gap:8px;padding:clamp(12px,1.1vw,20px) clamp(14px,1.3vw,24px);background:#3A3A3A}
.mur-nom{font-size:clamp(26px,2.4vw,44px);line-height:1}
.mur-marge{font-size:clamp(15px,1.2vw,20px);color:var(--attenue)}
.mur-marge strong{font-family:var(--titre);font-weight:600;font-size:clamp(32px,2.9vw,54px);line-height:.9;color:var(--encre)}
.mur-ligne{font-size:clamp(14px,1.15vw,19px);color:var(--attenue)}
.mur-ligne strong{color:var(--encre)}
.mur-ligne.discret{color:var(--discret)}
.mur-jour{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:clamp(14px,1.4vw,24px);border-top:1px solid #4E4E4E}
.mur-jour-chiffres{display:flex;flex-wrap:wrap;gap:8px clamp(18px,2.4vw,48px);font-size:clamp(15px,1.3vw,22px);color:var(--attenue)}
.mur-jour-chiffres strong{font-family:var(--titre);font-weight:600;font-size:clamp(28px,2.6vw,48px);color:var(--encre);margin-right:4px}
.mur-maj{font-size:13px;color:var(--discret)}

/* ---------- Écrans moyens et téléphone ---------- */

@media screen and (max-width:1099px){
  .jour-grille{grid-template-columns:minmax(0,1fr)}
  .jour-colonne.cote{position:static}
  .closings{grid-template-columns:minmax(0,1fr)}
  .tuiles.quatre{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media screen and (max-width:999px){
  .appel-grille{grid-template-columns:minmax(0,1fr);gap:16px}
  .conducteur{top:calc(var(--haut-barre) + var(--haut-bandeau,118px));z-index:13;margin:-22px -28px 0;padding:8px 28px;background:var(--verre);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid var(--filet)}
  .conducteur ol{flex-direction:row;gap:4px;overflow-x:auto;scrollbar-width:none}
  .conducteur ol::-webkit-scrollbar{display:none}
  .cd-etape{width:auto;white-space:nowrap;padding:6px 10px 6px 6px;font-size:13.5px}
  .cd-num{width:24px;height:24px;font-size:14px}
  .tuiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .tuile.hero{grid-column:1 / -1}
  .efficacite{grid-template-columns:minmax(0,1fr)}
  .objections-groupes,.scripts-grille{grid-template-columns:minmax(0,1fr)}
  .chiffres-jour{grid-template-columns:repeat(3,minmax(0,1fr))}
  .chiffre:nth-child(4){border-left:0;padding-left:0}
  .chiffre:nth-child(n+4){border-top:1px solid var(--filet)}
  .bandeau-mois{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .bm-marge{grid-column:1 / -1}
  .bandeau-mois .lien-carte{grid-column:1 / -1;justify-self:start}
  .fiche-ligne{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"qui action" "etape action" "quand action"}
  .fl-qui{grid-area:qui}.fl-etape{grid-area:etape}.fl-quand{grid-area:quand}
  .fiche-ligne > :last-child{grid-area:action}
  .mur-tuiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media screen and (max-width:759px){
  .page{gap:30px}
  /* Sur téléphone, la barre de l'appel défile avec la page : seul le conducteur reste sous le pouce */
  .appel-bandeau{position:relative;top:auto;z-index:auto;margin:0 -16px;padding:12px 16px 10px;-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--fond)}
  .ab-details{font-size:13px}
  .ab-actions{gap:8px 10px}
  .ab-actions .bouton-clair{padding:7px 12px}
  .conducteur{top:var(--haut-barre);margin:-14px -16px 0;padding:6px 16px;-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--fond)}
  .cd-lib{display:none}
  .cd-etape.actuel .cd-lib{display:inline}
  .axe-champs{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .obj-tete{grid-template-columns:minmax(0,1fr) auto}
  .obj-cat{grid-column:1 / -1}
  .obj-corps{padding:0 16px 16px 18px}
  .reformulation{padding:20px 18px;margin-right:14px}
  .tuiles,.tuiles.quatre{grid-template-columns:minmax(0,1fr)}
  .tuile.hero .tuile-valeur strong{font-size:50px}
  .ent-ligne{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"lib val" "barre barre";gap:4px 12px}
  .ent-lib{grid-area:lib}.ent-barre{grid-area:barre}.ent-val{grid-area:val;flex-direction:row;align-items:baseline;gap:8px}
  .chiffre strong{font-size:34px}
  .chiffre{padding:12px 10px 11px}
  .contact{grid-template-columns:76px minmax(0,1fr);grid-template-areas:"quand qui" "action action"}
  .contact-quand{grid-area:quand}.contact-qui{grid-area:qui}
  .contact > .bouton{grid-area:action;justify-self:start;margin-left:92px}
  .contact.retard::before,.fiche-ligne.retard::before,.vente-ligne.annulee::before{left:-10px}
  .session-choix{grid-template-columns:minmax(0,1fr)}
  .session-aide{display:none}
  .vente-ligne{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"date marge" "qui marge"}
  .vl-date{grid-area:date}.vl-qui{grid-area:qui}.vl-marge{grid-area:marge}
  .histo > li{grid-template-columns:minmax(0,1fr)}
  .histo-note{grid-column:1}
  .mur-tuiles{grid-template-columns:minmax(0,1fr)}
  .mur-heure{margin-left:0}
}
@media print{
  .appel-bandeau,.conducteur{position:static}
}

    }, 60000);
    setInterval(function () { if (document.visibilityState === "visible" && etat.tables && etat.vue !== "mur") rafraichir(); }, 120000);
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && etat.tables) rafraichir(); });
    // Le chrono de l'appel et l'heure du mur, sans redessiner la page.
    setInterval(function () {
      if (etat.appel) [].slice.call(document.querySelectorAll(".chrono-temps")).forEach(function (n) { n.textContent = duree(etat.appel); });
      var h = document.querySelector(".mur-heure");
      if (h) h.textContent = heureMur();
    }, 1000);
  }

  document.addEventListener("click", function () { if (etat.menu) { etat.menu = false; rendre(); } });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (feuille) { fermerFeuille(); return; }
      if (etat.menu) { etat.menu = false; rendre(); var b = app.querySelector(".compte-btn"); if (b) b.focus(); return; }
      if (etat.vue === "journee" && etat.saisie.pas !== "decroche") { reculerSaisie(); return; }
      return;
    }
    // La saisie rapide au clavier : 1 à 4 pour choisir, retour arrière pour revenir.
    if (etat.vue !== "journee" || feuille || e.altKey || e.ctrlKey || e.metaKey || !pret() || !peutSaisir) return;
    if (estSaisie(document.activeElement)) return;
    var pas = PAS[etat.saisie.pas], n = Number(e.key);
    if (pas && n >= 1 && n <= pas.o.length && /^[1-9]$/.test(e.key)) { e.preventDefault(); choisirSaisie(pas.o[n - 1][0]); return; }
    if (e.key === "Backspace" && etat.saisie.pas !== "decroche") { e.preventDefault(); reculerSaisie(); }
  });
  document.addEventListener("focusin", function (e) { if (estSaisie(e.target)) document.body.classList.add("en-saisie"); });
  document.addEventListener("focusout", function () {
    setTimeout(function () {
      if (!estSaisie(document.activeElement)) document.body.classList.remove("en-saisie");
      if (etat.differe && !feuille && !(etat.vue === "appel" && estSaisie(document.activeElement))) rendre();
    }, 0);
  });
  window.addEventListener("hashchange", function () {
    var v = vueDepuisAdresse();
    if (v !== etat.vue) { etat.vue = v; if (v === "resultats" || v === "mur") assurerMois(v === "mur" ? moisDe(aujourdhui()) : etat.mois); rendre(); }
  });
  window.addEventListener("beforeunload", function () { if (etat.appel) sauverBrouillon(); });
  // La courbe se redessine à la nouvelle largeur quand on tourne le téléphone ou qu'on redimensionne la fenêtre.
  var minuteurTaille = null, largeurVue = window.innerWidth;
  window.addEventListener("resize", function () {
    clearTimeout(minuteurTaille);
    minuteurTaille = setTimeout(function () {
      if (Math.abs(window.innerWidth - largeurVue) < 40) return;
      largeurVue = window.innerWidth;
      if (etat.vue === "resultats" && pret()) rendreSiCalme();
    }, 250);
  });

  P.pret.then(demarrer);
})();
</script>
