  /* ---------- Démarrage ---------- */

  function appel(fn, ctx, args) {
    if (typeof fn !== "function") return Promise.resolve(null);
    try { return Promise.resolve(fn.apply(ctx, args)).catch(function () { return null; }); } catch (e) { return Promise.resolve(null); }
  }

  /* ---------- Copie hors ligne et export ---------- */

  // Une copie exportée embarque le plan dans la page : elle s'ouvre sans connexion, en lecture seule.
  function lireInstantane() {
    try {
      var n = document.getElementById("instantane");
      if (!n) return null;
      var o = JSON.parse(n.textContent || "null");
      return o && typeof o === "object" && o.donnees && typeof o.donnees === "object" ? o : null;
    } catch (e) { return null; }
  }
  function chargerCopie() {
    var o = lireInstantane();
    if (!o) return false;
    COLLECTIONS.forEach(function (c) {
      var src = o.donnees[c], m = {};
      if (src && typeof src === "object") Object.keys(src).forEach(function (id) { var b = src[id]; if (b && typeof b === "object") m[id] = b; });
      donnees[c] = m;
      charge[c] = true;
      cache[c] = false;
    });
    dateCopie = typeof o.le === "string" && !isNaN(new Date(o.le).getTime()) ? o.le : null;
    horsLigne = true;
    lectureSeule = true;
    lent = false;
    coupe = false;
    etatDb = "pret";
    FILS = messagesPar();
    return true;
  }
  function libelleCopie() {
    if (!dateCopie) return "Copie du plan, en lecture seule";
    var d = new Date(dateCopie);
    return "Copie du plan au " + dateLongue(isoParis(d)).replace(/^\S+\s/, "") + " à " + heureParis(d).replace(/^0/, "") + ", en lecture seule";
  }
  function instantaneCourant() {
    var d = {};
    ELEMENTS.forEach(function (c) {
      var m = {};
      Object.keys(donnees[c]).forEach(function (id) {
        var src = donnees[c][id], b = {};
        Object.keys(src).forEach(function (k) { if (k !== "maj" && k !== "cree") b[k] = src[k]; });
        m[id] = b;
      });
      d[c] = m;
    });
    return { le: new Date().toISOString(), donnees: d };
  }
  function jsonEnPage(o) { return JSON.stringify(o).replace(/</g, "\\u003c").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029"); }
  // La page se reconstruit depuis son propre style et son propre code, jamais depuis le document affiché.
  function pageComplete(inst) {
    var style = document.getElementById("style") || [].filter.call(document.querySelectorAll("style"), function (n) { return n.textContent.indexOf("--orange-plein") >= 0; })[0];
    var code = SCRIPT_COURANT || document.getElementById("code");
    if (!style || !code || !style.textContent || !code.textContent) return null;
    var F = "<" + "/";
    return "<!DOCTYPE html>\n<html lang=\"fr\" data-theme=\"light\">\n<head>\n<meta charset=\"utf-8\">\n" +
      "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n" +
      "<meta name=\"theme-color\" content=\"#F5F5F7\">\n" +
      "<title>" + TITRE_PAGE + F + "title>\n" +
      "<style id=\"style\">" + style.textContent + F + "style>\n" + F + "head>\n<body>\n" +
      "<div id=\"app\"><noscript><p class=\"secours\">Cette page a besoin de JavaScript pour s'afficher." + F + "p>" + F + "noscript>" + F + "div>\n" +
      "<script>window.LIEN_ESPACE = " + JSON.stringify(LIEN_DIRECT).replace(/</g, "\\u003c") + ";" + F + "script>\n" +
      "<script id=\"instantane\" type=\"application/json\">" + jsonEnPage(inst) + F + "script>\n" +
      "<script id=\"code\">" + code.textContent + F + "script>\n" + F + "body>\n" + F + "html>\n";
  }
  function exporter() {
    if (!telechargements || exportEnCours || horsLigne || !toutCharge()) return;
    var html = pageComplete(instantaneCourant());
    if (!html) { annoncer("L'export n'est pas possible dans cette vue.", true); return; }
    exportEnCours = true;
    planifier();
    Promise.resolve().then(function () {
      return telechargements.save({ filename: "Plan visite Orange " + isoParis(new Date()) + ".html", data: html });
    }).then(function () {
      annoncer("Copie enregistrée. Elle s'ouvre sans connexion, en lecture seule.");
    }).catch(function (err) {
      var code = codeErreur(err);
      if (code === "declined") return;
      if (code === "rate_limited") { annoncer("Un export est déjà en cours. Réessayez dans un instant."); return; }
      if (code === "unavailable" || code === "not_granted" || code === "capability_disabled" || code === "capability_removed") telechargements = null;
      annoncer("L'export n'est pas possible dans cette vue.", true);
    }).then(function () { exportEnCours = false; planifier(); });
  }
  function boutonExport(classe, cle) {
    if (!telechargements || horsLigne || etatDb !== "pret" || !toutCharge()) return null;
    return el("button", { class: classe, type: "button", "data-cle": cle, disabled: exportEnCours, text: exportEnCours ? "Export en cours" : "Exporter une copie", onclick: exporter });
  }

  function abonner() {
    COLLECTIONS.forEach(function (c) {
      try {
        db.collection(c).onSnapshot(function (snap) {
          var m = {};
          (snap && snap.docs ? snap.docs : []).forEach(function (d) {
            if (!d || d.exists === false) return;
            var b = d.data();
            if (b && typeof b === "object") m[d.id] = b;
          });
          donnees[c] = m;
          charge[c] = true;
          cache[c] = !!(snap && snap.metadata && snap.metadata.fromCache);
          if (toutConfirme()) lent = false;
          FILS = messagesPar();
          apresSnapshot(c);
          planifier();
        }, function (err) {
          charge[c] = true;
          coupe = true;
          if (codeErreur(err) === "revoked") lectureSeule = true;
          planifier();
        });
      } catch (e) {
        charge[c] = true;
        coupe = true;
      }
    });
  }

  function demarrer() {
    if (PLATEFORME && (!window.claude || typeof window.claude.use !== "function")) {
      PLATEFORME.pret.then(function () {
        identite = lireLocal("pvo-identite") || "";
        focus = lireLocal("pvo-focus") || (identite && identite !== "autre" ? identite : "tous");
        demarrer();
      });
      return;
    }
    rendre();
    try {
      window.addEventListener("scroll", surDefilement, { passive: true });
      window.addEventListener("resize", surDefilement);
      window.addEventListener("popstate", surAdresse);
      window.addEventListener("hashchange", surAdresse);
      window.addEventListener("afterprint", finImpression);
      document.addEventListener("click", function () { if (menuCompte) { menuCompte = false; rendre(); } });
      document.addEventListener("keydown", function (e) { if (menuCompte && e.key === "Escape") { menuCompte = false; rendre(); var b = document.querySelector(".compte-btn"); if (b) b.focus(); } });
    } catch (e) { /* sans suivi */ }
    if (!window.claude || typeof window.claude.use !== "function") {
      if (chargerCopie()) setInterval(planifier, 60000); else etatDb = "absent";
      rendre();
      return;
    }
    setTimeout(function () { if (!toutConfirme()) { lent = true; planifier(); } }, 10000);
    setInterval(planifier, 60000);
    appel(window.claude.use, window.claude, ["user"]).then(function (u) {
      lecteur = u || null;
      if (!lecteur) return;
      appel(lecteur.can, lecteur, ["data.write"]).then(function (v) { droit = v === true ? true : (v === false ? false : null); planifier(); });
      appel(lecteur.isOwner, lecteur, []).then(function (v) { proprietaire = v === true; planifier(); });
      appel(lecteur.me, lecteur, []).then(function (me) {
        if (me && typeof me === "object") { monId = typeof me.id === "string" ? me.id : null; nomProfil = typeof me.name === "string" ? me.name : ""; }
        planifier();
      });
    });
    appel(window.claude.use, window.claude, ["downloads"]).then(function (t) {
      telechargements = t && typeof t.save === "function" ? t : null;
      planifier();
    });
    appel(window.claude.use, window.claude, ["db"]).then(function (d) {
      if (!d) { if (!chargerCopie()) etatDb = "absent"; planifier(); return; }
      db = d;
      etatDb = "pret";
      abonner();
      planifier();
    });
  }

  demarrer();
})();
</script>
</body>
</html>
