ul,ol{list-style:none}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--encre);outline-offset:2px}
.secours{max-width:640px;margin:96px auto;padding:0 24px}

/* Typographie : une seule famille, des titres serrés, rien en capitales */
h1{font-weight:700;font-size:clamp(34px,5vw,50px);line-height:1.04;letter-spacing:-.035em;text-wrap:balance}
h2{font-weight:700;font-size:clamp(23px,2.5vw,29px);line-height:1.14;letter-spacing:-.026em;text-wrap:balance}
h3{font-size:16px;line-height:1.3;font-weight:650;letter-spacing:-.01em}

/* La marque */
.marque{display:inline-flex;align-items:center;gap:12px;text-decoration:none}
.logo{display:block;height:21px;aspect-ratio:374 / 189;background:var(--logo) no-repeat center / contain}
.marque-sep{width:1px;height:16px;background:var(--filet-2)}
.marque-bu{font-size:13.5px;font-weight:600;color:var(--attenue);white-space:nowrap}

/* En-tête : la marque, les trois pages, le compte */
.barre{position:sticky;top:0;z-index:20;background:var(--verre);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--filet)}
.barre-int{max-width:1168px;margin:0 auto;padding:0 24px;display:flex;align-items:stretch;gap:0 32px;min-height:60px}
.barre .marque{align-self:center}
.onglets{display:flex;gap:2px}
.onglet{position:relative;display:inline-flex;align-items:center;gap:8px;padding:0 13px;font-size:14.5px;font-weight:550;color:var(--attenue);white-space:nowrap}
.onglet svg{flex:none;opacity:.85}
.onglet:hover{color:var(--encre)}
.onglet::after{content:"";position:absolute;left:11px;right:11px;bottom:-1px;height:2.5px;border-radius:2px 2px 0 0;background:var(--orange);opacity:0}
.onglet.actif{color:var(--encre);font-weight:650}
.onglet.actif::after{opacity:1}
.onglet .court{display:none}
.onglet-badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:inline-grid;place-items:center;font-size:12px;font-weight:700;background:var(--orange-plein);color:#FFFFFF;font-variant-numeric:tabular-nums}

.compte{position:relative;margin-left:auto;align-self:center}
.compte-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:13.5px;font-weight:700;letter-spacing:.02em;color:#FFFFFF;background:linear-gradient(145deg,#2C2C30,#111113);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 0 0 2px var(--papier),0 0 0 3.5px var(--orange)}
:root[data-theme="dark"] .compte-btn{background:linear-gradient(145deg,#4A4A50,#2C2C30)}
.compte-menu{position:absolute;right:0;top:calc(100% + 10px);z-index:30;width:272px;background:var(--papier);border:1px solid var(--filet);border-radius:16px;box-shadow:0 18px 48px -12px rgba(0,0,0,.28);padding:6px;display:flex;flex-direction:column}
.compte-qui{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px;margin-bottom:4px;border-bottom:1px solid var(--filet)}
.compte-qui strong{font-size:15px;font-weight:650}
.compte-qui span{font-size:13.5px;color:var(--discret);overflow-wrap:anywhere}
.compte-item{width:100%;padding:10px 12px;border-radius:10px;font-size:14.5px;font-weight:550}
.compte-item:hover{background:var(--survol)}

/* La page, ses sections, leurs titres : le trait orange reprend celui du O de LUSKO */
.page{max-width:1168px;margin:0 auto;padding:28px 24px 120px;display:flex;flex-direction:column;gap:68px}
.page.vue-accueil{gap:20px}
.page-tete{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding-top:20px;margin-bottom:-20px}
.intro{color:var(--attenue);font-size:17px;max-width:68ch}
.sommaire{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sommaire-lien{display:inline-flex;align-items:center;min-height:36px;padding:6px 14px;border-radius:999px;background:var(--papier);border:1px solid var(--filet-2);font-size:14px;font-weight:600;text-decoration:none}
.sommaire-lien:hover{border-color:var(--discret)}
.section{display:flex;flex-direction:column;gap:20px;min-width:0;scroll-margin-top:84px}
.titre{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px}
.titre h2::before{content:"";display:block;width:28px;height:4px;border-radius:2px;background:var(--orange);margin-bottom:12px}
.carte{background:var(--papier);border:1px solid var(--filet);border-radius:var(--r-l);box-shadow:var(--ombre);overflow:hidden}
.vide{padding:18px 22px;color:var(--discret);font-size:15px}
.legende{font-size:13.5px;color:var(--discret)}
.alerte{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:var(--r-m);background:var(--rouge-teinte);color:var(--rouge-texte);font-size:15px}
.chargement{display:flex;align-items:center;gap:12px;color:var(--attenue);padding:48px 4px;font-size:15px}
.etat-vide{display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding:48px 4px;color:var(--attenue)}

/* Boutons et liens */
.ajouter{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:var(--piste);border-radius:999px;padding:9px 16px 9px 13px;font-size:14px;font-weight:600;line-height:1.3;white-space:nowrap}
.ajouter:hover{background:var(--filet-2)}
.ajouter svg{flex:none}
.lien-modifier{font-size:14px;font-weight:600;color:var(--attenue);text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.lien-modifier:hover{color:var(--encre)}
.lien-modifier.actif{color:var(--encre);text-decoration:none;background:var(--piste);border-radius:999px;padding:4px 12px}
.chevron{width:9px;height:9px;border-right:2px solid var(--discret);border-bottom:2px solid var(--discret);transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s var(--ease)}
[aria-expanded="true"] .chevron{transform:rotate(-135deg) translate(-2px,-2px)}
.nom{font-size:12.5px;font-weight:550;line-height:1;padding:5px 9px;border-radius:999px;background:var(--piste);color:var(--attenue);white-space:nowrap;letter-spacing:0}
.nom.moi{background:transparent;box-shadow:inset 0 0 0 1.5px var(--encre);color:var(--encre);font-weight:650}
.jauge{display:block;height:4px;border-radius:2px;background:var(--piste);overflow:hidden}
.jauge i{display:block;height:100%;border-radius:2px;background:var(--orange)}
.pastille{font-size:12px;font-weight:650;line-height:1;padding:5px 9px;border-radius:999px;white-space:nowrap}
.p-retenu{background:var(--vert-teinte);color:var(--vert-texte)}
.p-propose{box-shadow:inset 0 0 0 1px var(--filet-2);color:var(--attenue)}
.p-ecarte{background:var(--piste);color:var(--discret)}

/* Accueil : le bandeau de la visite, puis quatre cartes */
.banniere{position:relative;overflow:hidden;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px 48px;align-items:end;border-radius:var(--r-xl);padding:40px 44px 36px;color:#F5F5F7;background:radial-gradient(120% 140% at 100% 0%,rgba(239,120,27,.42) 0%,rgba(239,120,27,0) 46%),radial-gradient(90% 120% at 0% 100%,rgba(255,255,255,.06) 0%,rgba(255,255,255,0) 60%),linear-gradient(135deg,#232327 0%,#141416 100%);box-shadow:0 1px 2px rgba(0,0,0,.08),0 24px 48px -28px rgba(0,0,0,.45)}
.banniere::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(239,120,27,.85) 30%,rgba(239,120,27,.85) 70%,transparent) top / 100% 2px no-repeat}
.banniere-texte{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.banniere-sur{font-size:13px;font-weight:600;letter-spacing:.02em;color:rgba(245,245,247,.62)}
.banniere h1{color:#FFFFFF;font-size:clamp(34px,4.6vw,54px);margin-top:10px}
.banniere-sous{margin-top:8px;font-size:15.5px;font-weight:550;color:rgba(245,245,247,.82)}
.banniere-but{margin-top:20px;max-width:64ch;font-size:16.5px;line-height:1.5;color:rgba(245,245,247,.88);padding-left:14px;border-left:2px solid #EF781B;text-wrap:pretty}
.banniere-actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-top:24px}
.banniere-bouton{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#FFFFFF;border-radius:999px;padding:9px 14px 9px 16px;font-size:14px;font-weight:600;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.banniere-bouton:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.34)}
.banniere :focus-visible{outline-color:#FFFFFF}
.direct{display:inline-flex;align-items:center;gap:10px;font-size:13.5px;color:rgba(245,245,247,.72)}
.direct i{width:8px;height:8px;border-radius:50%;background:#3CCB7F;box-shadow:0 0 0 4px rgba(60,203,127,.22)}
.banniere-compte{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.bn-jours{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.bn-compte{font-size:clamp(48px,6vw,72px);font-weight:750;line-height:1;letter-spacing:-.045em;color:#FFFFFF;font-variant-numeric:tabular-nums;white-space:nowrap}
.bn-compte-lib{font-size:14px;color:rgba(245,245,247,.7)}
.bn-stats{display:flex;gap:22px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)}
.bn-stat{display:flex;flex-direction:column;align-items:flex-end}
.bn-stat-val{font-size:17px;font-weight:650;color:#FFFFFF;font-variant-numeric:tabular-nums;white-space:nowrap}
.bn-stat-lib{font-size:12.5px;color:rgba(245,245,247,.62);white-space:nowrap}

.cartes-accueil{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.carte-accueil{--c:var(--discret);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:stretch;gap:14px;background:var(--papier);border:1px solid var(--filet);border-radius:var(--r-l);padding:24px 26px 22px;box-shadow:var(--ombre)}
.carte-accueil::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c)}
.carte-accueil::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(80% 70% at 100% 0%,color-mix(in srgb,var(--c) 8%,transparent),transparent 70%)}
.carte-accueil > *{position:relative;z-index:1}
.ca-attendu{--c:var(--orange)}
.ca-equipe{--c:var(--bleu)}
.ca-journee{--c:var(--encre)}
.ca-sujets{--c:var(--vert)}
.ca-journee::after{display:none}
.ca-tete{display:flex;align-items:center;gap:12px}
.ca-tuile{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;flex:none;color:var(--c);background:var(--piste);background:color-mix(in srgb,var(--c) 13%,transparent)}
.ca-attendu .ca-tuile{color:var(--orange-texte)}
.ca-sujets .ca-tuile{color:var(--vert-texte)}
.ca-titre{font-size:17px;font-weight:650;letter-spacing:-.01em;line-height:1.3;min-width:0}
.ca-texte{font-size:15.5px;line-height:1.5;color:var(--attenue)}
.ca-meta{font-size:13px;color:var(--discret);margin-top:-8px}
.ca-lien{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;margin-top:auto;padding:2px 0;font-size:14.5px;font-weight:600}
.ca-lien:hover span{text-decoration:underline;text-underline-offset:3px}
.ca-liste{display:flex;flex-direction:column;margin:-4px 0 0}
.ca-liste li + li{border-top:1px solid var(--filet)}
.ca-tache{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;width:calc(100% + 16px);margin:0 -8px;padding:12px 8px;border-radius:10px}
.ca-tache:hover{background:var(--survol)}
.ca-tache-corps{display:flex;flex-direction:column;gap:3px;min-width:0}
.ca-tache-lib{font-size:15px;font-weight:550;line-height:1.4;text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ca-decider{font-size:13px;font-weight:650;color:var(--orange-texte);margin-right:2px}
.ca-tache-meta{font-size:13px;color:var(--discret)}
.ca-badge{flex:none;font-size:12px;font-weight:650;line-height:1;padding:6px 10px;border-radius:999px;white-space:nowrap;background:var(--piste);color:var(--attenue)}
.ca-badge.proche{color:var(--encre)}
.ca-badge.retard{background:#FDF0D5;color:#8A5300}
:root[data-theme="dark"] .ca-badge.retard{background:rgba(212,137,10,.2);color:#F3C46B}
.ca-grand{font-size:40px;font-weight:750;line-height:1.05;letter-spacing:-.035em;color:var(--encre);color:color-mix(in srgb,var(--c) 62%,var(--encre))}
.ca-grand.retard{color:var(--rouge-texte)}
.ca-jalon{align-self:flex-start;font-size:17px;font-weight:650;line-height:1.35;letter-spacing:-.01em}
.ca-jalon:hover{text-decoration:underline;text-underline-offset:3px}
.ca-suite{display:flex;flex-direction:column;margin-top:4px;padding-top:6px;border-top:1px solid var(--filet)}
.ca-suite-btn{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;align-items:baseline;width:calc(100% + 16px);margin:0 -8px;padding:9px 8px;border-radius:10px}
.ca-suite-btn:hover{background:var(--survol)}
.ca-suite-date{font-size:13px;font-weight:650;color:var(--attenue);font-variant-numeric:tabular-nums;white-space:nowrap}
.ca-suite-lib{font-size:14.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ca-role{display:flex;flex-direction:column;gap:3px;padding-top:14px;border-top:1px solid var(--filet);font-size:15px;line-height:1.5;color:var(--attenue)}
.ca-role-lib{font-size:13px;font-weight:600;color:var(--discret)}
.ca-compteurs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ca-compteur{display:flex;flex-direction:column;gap:4px;border:1px solid var(--filet);border-radius:16px;padding:14px 16px 14px;background:var(--papier)}
.cs-val{font-size:34px;font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cs-lib{font-size:13px;color:var(--attenue)}
.ca-compteur .jauge{margin-top:8px}
.ca-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;margin-top:auto}
.ca-actions .ca-lien{margin-top:0}
.bouton-clair{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--filet-2);background:var(--papier);border-radius:999px;padding:8px 16px 8px 13px;font-size:14px;font-weight:600;line-height:1.3;white-space:nowrap}
.bouton-clair:hover{border-color:var(--discret)}

/* La journée à l'échelle : en petit sur l'accueil, en grand au-dessus du programme */
.mini-frise-cadre{display:flex;flex-direction:column;gap:6px}
.mini-frise{position:relative;height:28px}
.mf-seg{position:absolute;top:0;bottom:0;border:solid transparent;border-width:0 1px;border-radius:5px;background-color:var(--filet-2);background-clip:padding-box}
.mf-pause{background-color:transparent;background-image:repeating-linear-gradient(135deg,transparent 0 4px,var(--filet-2) 4px 5px)}
.mf-seg.mien{background-color:var(--encre)}
.mf-pause.mien{background-color:transparent}
.mf-fort,.mf-fort.mien{background-color:var(--orange)}
.mini-bornes{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--discret);font-variant-numeric:tabular-nums}
.legende-frise{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12.5px;color:var(--discret)}
.legende-frise span{display:inline-flex;align-items:center;gap:7px}
.ex{width:14px;height:8px;border-radius:3px;flex:none}
.ex-mien{background:var(--encre)}
.ex-fort{background:var(--orange)}
.frise-cadre{display:flex;flex-direction:column;gap:6px;background:var(--papier);border:1px solid var(--filet);border-radius:var(--r-l);padding:20px 30px 16px 22px;box-shadow:var(--ombre)}
.frise{position:relative;height:60px}
.seg{position:absolute;top:0;bottom:0;padding:0 2px;min-width:0;container-type:inline-size}
.seg-boite{height:100%;border:1px solid var(--filet-2);background:var(--papier-2);border-radius:var(--r-s);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0 5px 2px}
.seg:hover .seg-boite{border-color:var(--discret)}
.seg-nom{font-size:12px;line-height:1.22;font-weight:650;text-align:center;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@container (max-width:84px){.seg-nom{display:none}}
.seg-pause .seg-boite{border-color:transparent;border-radius:5px;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--filet-2) 5px 6px)}
.seg-fort .seg-boite{background:var(--orange-plein);border-color:var(--orange-plein);color:#FFFFFF}
.seg.mien .seg-boite{box-shadow:inset 0 -4px 0 var(--encre)}
.seg-pause.mien .seg-boite{box-shadow:none}
.seg-fort.mien .seg-boite{box-shadow:inset 0 -4px 0 rgba(255,255,255,.9)}
.graduations{position:relative;height:22px}
.graduation{position:absolute;top:0;transform:translateX(-50%);padding-top:8px;font-size:11.5px;font-weight:600;color:var(--discret);white-space:nowrap;font-variant-numeric:tabular-nums}
.graduation::before{content:"";position:absolute;left:50%;top:0;width:1px;height:5px;background:var(--discret)}
.frise-cadre .ex-mien{height:4px;border-radius:2px}

/* Le programme : matin, midi, après-midi */
.deroule{display:flex;flex-direction:column;gap:30px}
.moment{display:flex;flex-direction:column;gap:10px}
.moment-tete{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 6px}
.moment-nom{font-size:19px;font-weight:700;letter-spacing:-.02em}
.moment-heures{font-size:14px;font-weight:600;color:var(--attenue);font-variant-numeric:tabular-nums;white-space:nowrap}
.programme > li + li{border-top:1px solid var(--filet)}
.creneau{scroll-margin-top:96px}
.creneau-tete{width:100%;display:grid;grid-template-columns:62px minmax(0,1fr) 62px 14px;align-items:center;gap:4px 16px;padding:15px 24px}
button.creneau-tete:hover{background:var(--survol)}
.heure{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
.creneau-corps{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;min-width:0}
.creneau-titre{font-size:16.5px;font-weight:650;line-height:1.3;letter-spacing:-.008em;min-width:0}
.creneau-fort{display:inline-block;margin-left:6px;font-size:12px;font-weight:650;line-height:1;padding:4px 8px;border-radius:999px;color:var(--orange-texte);box-shadow:inset 0 0 0 1px var(--orange-texte);vertical-align:2px;letter-spacing:0;white-space:nowrap}
.creneau-qui{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;flex:none;max-width:52%}
.creneau-duree{font-size:13px;font-weight:600;color:var(--discret);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.creneau .chevron{justify-self:center}
.creneau.pause{background:var(--papier-2)}
.creneau.pause .creneau-tete{padding-top:9px;padding-bottom:9px}
.creneau.pause .heure,.creneau.pause .creneau-titre{font-size:14px;font-weight:500;color:var(--discret)}
.creneau.fort{box-shadow:inset 3px 0 0 var(--orange);background:linear-gradient(90deg,var(--orange-teinte),transparent 55%)}
.creneau.fort .heure{color:var(--orange-texte)}
.creneau-detail{padding:0 24px 18px 102px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-size:15px;color:var(--attenue);line-height:1.5}
.creneau-detail p{max-width:68ch}
.creneau-fin{font-size:13.5px;color:var(--discret)}

/* Qui vient, qui fait quoi, nos messages : des fiches */
.fiches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.fiches.trois{grid-template-columns:repeat(3,minmax(0,1fr))}
.fiche{display:flex;flex-direction:column;gap:16px;background:var(--papier);border:1px solid var(--filet);border-radius:var(--r-l);padding:22px 24px;box-shadow:var(--ombre)}
.fiche.modifiable{padding:0}
.fiche .ref-btn{width:100%;height:100%;display:flex;flex-direction:column;gap:16px;padding:22px 24px;border-radius:var(--r-l)}
.fiche.modifiable:hover{border-color:var(--discret)}
.fiche.moi{border-color:var(--encre);box-shadow:0 0 0 1px var(--encre)}
.fiche-id{display:flex;align-items:center;gap:14px;min-width:0}
.mono{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:650;font-size:14px;letter-spacing:.01em;color:var(--encre);background:var(--piste)}
.fiche.moi .mono{background:var(--encre);color:var(--fond)}
.fiche-noms{display:flex;flex-direction:column;gap:3px;min-width:0}
.fiche-nom{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:18px;font-weight:650;line-height:1.2;letter-spacing:-.016em}
.fiche-titre{font-size:13.5px;line-height:1.35;color:var(--discret)}
.fiche-bas{display:flex;flex-direction:column;gap:3px;padding-top:14px;border-top:1px solid var(--filet);margin-top:auto}
.fiche-lib{font-size:13px;font-weight:600;color:var(--discret)}
.fiche-texte{font-size:15px;line-height:1.5;color:var(--attenue)}
.fiche.message,.fiche.message .ref-btn{gap:8px}
.duo-sections{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:56px 36px;align-items:start}
.regles > li + li,.notes > li + li{border-top:1px solid var(--filet)}
.regles > li,.notes > li{position:relative;font-size:15.5px;line-height:1.5}
.regles > li.ref:not(.modifiable),.notes > li{padding:15px 24px 15px 46px}
.regles .ref-btn{width:100%;display:block;padding:15px 24px 15px 46px}
.regles .ref-btn:hover{background:var(--survol)}
.regles > li::before,.notes > li::before{content:"";position:absolute;left:24px;top:24px;width:7px;height:7px;border-radius:50%;background:var(--orange)}
.notes > li::before{background:var(--filet-2)}

/* À faire : les décisions d'abord, puis les tâches mois par mois ; à côté, les sujets pour Orange */
.resume{display:flex;flex-wrap:wrap;gap:4px 22px;color:var(--attenue);font-size:16px}
.resume strong{color:var(--encre);font-weight:700;font-variant-numeric:tabular-nums}
.resume .en-alerte,.resume .en-alerte strong{color:var(--rouge-texte)}
.deux-colonnes{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:64px 44px;align-items:start}
.vue-afaire .section{gap:14px}
.filtre{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--piste)}
.filtre-btn{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--attenue);white-space:nowrap}
.filtre-btn.actif{background:var(--pouce);color:var(--encre);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.05)}
.filtre-n{font-size:12.5px;font-weight:700;color:var(--discret);font-variant-numeric:tabular-nums}
.groupe-tete{display:flex;align-items:center;gap:12px;padding:16px 24px 6px}
.groupe-nom{font-size:16px;font-weight:700;letter-spacing:-.012em}
.groupe-compte{margin-left:auto;font-size:13px;font-weight:600;color:var(--discret);font-variant-numeric:tabular-nums;white-space:nowrap}
.groupe-tete .jauge{width:56px;flex:none}
.groupe-decisions{border-color:var(--filet-2)}
.groupe-decisions .groupe-nom{color:var(--orange-texte)}
.liste > li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:14px;align-items:start;padding:0 0 0 24px}
.liste > li + li .item-corps{border-top:1px solid var(--filet)}
.item-corps{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;width:100%;padding:14px 24px 14px 0}
.item-corps:hover .item-texte{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--filet-2)}
.item-texte{font-size:15.5px;line-height:1.4}
.decision .item-texte{font-weight:600}
.item-date{font-size:13.5px;color:var(--discret);white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:2px}
.item-meta{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13.5px;color:var(--discret)}
.etiquette{font-weight:650;color:var(--vert-texte)}
.item-reponse{color:var(--attenue);flex-basis:100%}
.en-retard .item-date{color:var(--rouge-texte);font-weight:600}
.fini .item-texte{color:var(--discret);text-decoration:line-through;text-decoration-color:var(--filet-2)}
.coche,.marque-q{margin-top:14px}
.coche{width:22px;height:22px;border-radius:50%;border:2px solid var(--filet-2);display:grid;place-items:center;background:var(--papier)}
button.coche:hover{border-color:var(--vert)}
.coche[aria-pressed="true"]{background:var(--vert);border-color:var(--vert)}
.coche[aria-pressed="true"]::after{content:"";width:6px;height:11px;border-right:2.5px solid #FFFFFF;border-bottom:2.5px solid #FFFFFF;transform:translateY(-1px) rotate(45deg)}
.coche.lecture{opacity:.6}
.fini .coche.lecture{background:var(--vert);border-color:var(--vert)}
.marque-q{width:22px;height:22px;border-radius:50%;border:2px solid var(--orange);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--orange-texte)}
.fini .marque-q{border-color:var(--vert);background:var(--vert-teinte)}
.bascule{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;font-size:15px;font-weight:600;color:var(--attenue)}
.bascule:hover{background:var(--survol)}
.bascule.nue{padding:6px 4px;border-radius:8px}
.liste.faits{border-top:1px solid var(--filet)}
.jauge-carte{display:flex;flex-direction:column;gap:10px;padding:16px 20px 14px}
.jauge-texte{font-size:15px;color:var(--attenue)}
.jauge-texte strong{font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--encre);margin-right:2px}
.groupe-sujets{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.groupe-titre{font-size:14.5px;font-weight:650;color:var(--attenue);padding:0 4px}
.sujets{display:flex;flex-direction:column;gap:10px}
.carte-sujet{width:100%;display:flex;flex-direction:column;gap:8px;background:var(--papier);border:1px solid var(--filet);border-radius:16px;padding:16px 18px;box-shadow:var(--ombre)}
.carte-sujet:hover{border-color:var(--discret)}
.statut-retenu .carte-sujet{border-color:var(--vert);border-color:color-mix(in srgb,var(--vert) 45%,var(--filet))}
.statut-ecarte .carte-sujet{background:transparent;box-shadow:none}
.statut-ecarte .sujet-texte{text-decoration:line-through;text-decoration-color:var(--discret);color:var(--discret)}
.sujet-tete{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sujet-porteur{font-size:13px;color:var(--discret);text-align:right}
.sujet-texte{font-size:15.5px;font-weight:650;line-height:1.38;letter-spacing:-.008em}
.sujet-preuve{font-size:14px;line-height:1.45;color:var(--attenue)}
.sujet-preuve strong{color:var(--encre);font-weight:600}

/* Accueil : le passage vers les remontées des équipes */
.ca-remontees{display:flex;align-items:center;gap:10px;width:calc(100% + 16px);margin:2px -8px -6px;padding:12px 8px;border-top:1px solid var(--filet);border-radius:0 0 10px 10px;font-size:14.5px;font-weight:600;text-align:left}
.ca-remontees:hover{background:var(--survol)}
.ca-remontees-icone{display:grid;place-items:center;color:var(--vert-texte)}
.ca-remontees-lib{flex:1;min-width:0}
.ca-remontees-n{font-size:13.5px;font-weight:600;color:var(--discret);white-space:nowrap;font-variant-numeric:tabular-nums}

/* Remontées : le questionnaire à côté, les réponses au centre */
.remontees-grille{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-areas:"reponses lien";gap:56px 44px;align-items:start}
.remontees-cote{grid-area:lien;position:sticky;top:84px;display:flex;flex-direction:column;gap:44px;min-width:0}
.remontees-grille > #bloc-remontees{grid-area:reponses}
.questionnaire-carte{display:flex;flex-direction:column;gap:14px;padding:20px 22px}
.q-statut{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:650}
.q-statut i{width:8px;height:8px;border-radius:50%;background:var(--vert);box-shadow:0 0 0 4px var(--vert-teinte);flex:none}
.q-statut.ferme i{background:var(--discret);box-shadow:0 0 0 4px var(--piste)}
.q-texte{font-size:14.5px;line-height:1.5;color:var(--attenue)}
.lien-ligne{display:flex;gap:8px;align-items:stretch}
.lien-champ{flex:1;min-width:0;font-size:14px;padding:10px 12px;color:var(--attenue);text-overflow:ellipsis}
.lien-ligne .bouton{flex:none;white-space:nowrap;padding:10px 16px;font-size:14.5px;text-align:center}
.lien-actions{display:flex;flex-wrap:wrap;gap:8px 20px}
.remontees-outils{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.metiers-resume{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14.5px;color:var(--attenue);margin-top:-4px}
.metiers-resume strong{color:var(--encre);font-weight:700;font-variant-numeric:tabular-nums}
.groupe-remontees{display:flex;flex-direction:column;gap:10px}
.groupe-remontees + .groupe-remontees{margin-top:20px}
.groupe-remontees-tete{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 4px}
.groupe-remontees-tete h3{font-size:17px;font-weight:700;letter-spacing:-.015em;line-height:1.3}
.remontees{display:flex;flex-direction:column;gap:10px}
.remontee{display:flex;flex-direction:column;gap:10px;background:var(--papier);border:1px solid var(--filet);border-radius:16px;padding:16px 18px;box-shadow:var(--ombre)}
.remontee-texte{font-size:15.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-width:72ch}
.remontee-pied,.remontee-tete{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px}
.remontee-meta{font-size:13px;font-weight:550;color:var(--discret)}
.remontee-retrait{display:inline-flex;gap:16px}
.remontee-q{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.remontee-q + .remontee-q{border-top:1px solid var(--filet);padding-top:12px}
.remontee-q h4{margin:0;font-size:13.5px;font-weight:650;color:var(--attenue)}
.remontee-q .lien-action{margin-top:2px}
.vide-action{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;color:var(--attenue);font-size:15px}

/* Les feuilles : lire, modifier, ajouter */
.voile{position:fixed;inset:0;z-index:50;background:var(--voile);display:flex;align-items:flex-end;justify-content:center}
.feuille{width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;background:var(--papier);border-radius:22px 22px 0 0;box-shadow:var(--ombre-haute);overflow:hidden}
.feuille-tete{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 18px 8px 22px}
.feuille-tete h2{font-size:20px;font-weight:650;letter-spacing:-.015em;line-height:1.25}
.feuille-fermer{width:36px;height:36px;border-radius:50%;background:var(--piste);position:relative;flex:none}
.feuille-fermer::before,.feuille-fermer::after{content:"";position:absolute;left:11px;top:17px;width:14px;height:2px;border-radius:1px;background:var(--attenue);transform:rotate(45deg)}
.feuille-fermer::after{transform:rotate(-45deg)}
.feuille-corps{padding:4px 22px 6px;overflow:auto;flex:1}
.feuille-erreur{padding:0 22px;color:var(--rouge-texte);font-size:14.5px}
.feuille-erreur:empty{display:none}
.feuille-pied{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 22px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--filet)}
.bouton{border-radius:12px;padding:12px 18px;font-size:15.5px;font-weight:650;color:#FFFFFF;background:linear-gradient(135deg,#2C2C30,#111113);box-shadow:inset 0 -2px 0 var(--orange)}
.bouton:hover{background:linear-gradient(135deg,#3A3A40,#1D1D1F)}
.bouton:disabled{opacity:.55;cursor:default}
:root[data-theme="dark"] .bouton{background:linear-gradient(135deg,#F5F5F7,#D9D9DE);color:#111113}
.bouton.secondaire,:root[data-theme="dark"] .bouton.secondaire{background:none;color:var(--encre);box-shadow:inset 0 0 0 1.5px var(--filet-2)}
.bouton.danger,:root[data-theme="dark"] .bouton.danger{margin-left:auto;background:none;box-shadow:none;color:var(--rouge-texte);padding-left:6px;padding-right:6px}
.champ{margin:14px 0;display:flex;flex-direction:column;gap:6px}
.champ-lib{font-size:14px;font-weight:650}
.champ-aide{font-size:13.5px;color:var(--discret)}
.saisie{width:100%;padding:12px 14px;border:1px solid var(--filet-2);border-radius:12px;background:var(--papier-2);font-size:16px;line-height:1.4}
textarea.saisie{resize:vertical;min-height:48px}
.saisie:focus{outline:none;border-color:var(--encre);box-shadow:0 0 0 4px var(--piste)}
.saisie.petite{width:auto;padding:8px 10px;font-size:14.5px;border-radius:10px}
.puces,.segments{display:flex;flex-wrap:wrap;gap:8px}
.puce,.segment{position:relative}
.puce input,.segment input{position:absolute;opacity:0;width:1px;height:1px}
.puce span,.segment span{display:inline-flex;align-items:center;min-height:38px;padding:7px 14px;border-radius:19px;border:1.5px solid var(--filet-2);font-size:14.5px;font-weight:550;cursor:pointer;user-select:none}
.puce input:checked + span,.segment input:checked + span{background:var(--encre);border-color:var(--encre);color:var(--papier)}
.puce input:focus-visible + span,.segment input:focus-visible + span{outline:2px solid var(--encre);outline-offset:2px}
.case-lib{display:flex;align-items:center;gap:10px;font-size:15.5px;font-weight:550;cursor:pointer}
.case-lib input{width:20px;height:20px;accent-color:var(--encre)}
.lecture{display:flex;flex-direction:column;gap:14px;padding:8px 0 10px}
.lecture-ligne{display:flex;flex-direction:column;gap:2px}
.lecture dt{font-size:13.5px;font-weight:600;color:var(--discret)}
.lecture dd{font-size:16px;line-height:1.45}
.sous-titre{padding:16px 18px 2px;font-size:14px;font-weight:650;color:var(--discret)}

/* Les accès */
.acces .chargement{padding:20px 0}
.membres > li{padding:14px 0;border-bottom:1px solid var(--filet)}
.membre-qui{display:flex;flex-direction:column;gap:1px}
.membre-nom{font-size:15.5px;font-weight:600}
.membre-email,.membre-etat{font-size:13.5px;color:var(--discret);overflow-wrap:anywhere}
.membre-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:10px}
.lien-action{font-size:14.5px;font-weight:600;color:var(--encre);text-decoration:underline;text-underline-offset:3px}
.lien-action.danger{color:var(--rouge-texte)}
.lien-action:disabled{opacity:.5}
.membre-form{margin-top:6px;padding-top:4px}
.membre-form .sous-titre{padding:14px 0 0}
.membre-form .bouton{margin-top:4px}
.deux{display:grid;grid-template-columns:1fr;gap:0 12px}
.erreur{color:var(--rouge-texte);font-size:14.5px}
.erreur:empty{display:none}

/* Outils communs aux nouvelles pages */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.section-intro{font-size:15.5px;line-height:1.5;color:var(--attenue);max-width:70ch;margin-top:-6px;text-wrap:pretty}
.page-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.page-actions .bouton{padding:10px 18px;font-size:14.5px}
.sur-titre{font-size:14.5px;font-weight:600;color:var(--discret);margin-bottom:-6px}
.colonne{display:flex;flex-direction:column;gap:64px;min-width:0}

/* Le programme : l'avancement des fiches, puis la fiche dans chaque créneau */
.avancement{display:grid;grid-template-columns:auto 120px minmax(0,1fr) auto;align-items:center;gap:8px 16px;padding:14px 20px;border-radius:var(--r-m);background:var(--papier);border:1px solid var(--filet)}
.avancement-texte{font-size:14.5px;color:var(--attenue);white-space:nowrap}
.avancement-texte strong{color:var(--encre);font-variant-numeric:tabular-nums}
.avancement-aide{font-size:13.5px;color:var(--discret);min-width:0}
.avancement .lien-action{font-size:14px;white-space:nowrap}
.fiche-etat{display:inline-block;margin-left:6px;font-size:12px;font-weight:650;line-height:1;padding:4px 8px;border-radius:999px;color:var(--orange-texte);background:var(--orange-teinte);vertical-align:2px;letter-spacing:0;white-space:nowrap}
.fiche-etat.prete{color:var(--vert-texte);background:var(--vert-teinte)}
.fiche-seq{display:grid;gap:10px;width:100%;max-width:72ch;margin:2px 0 4px;padding:14px 16px;border-radius:var(--r-m);background:var(--papier-2);border:1px solid var(--filet)}
.fiche-seq > div{display:flex;flex-direction:column;gap:2px}
.fiche-seq dt{font-size:12.5px;font-weight:650;color:var(--discret)}
.fiche-seq dd{font-size:15px;line-height:1.45;color:var(--encre)}

/* Les chiffres de la journée */
.chiffres > li + li{border-top:1px solid var(--filet)}
.chiffre-btn{width:100%;display:flex;flex-direction:column;gap:3px;padding:15px 24px}
.chiffre-btn:hover{background:var(--survol)}
.chiffre-valeur{font-size:16px;font-weight:650;line-height:1.4;letter-spacing:-.006em}
.chiffre-ou{font-size:13.5px;color:var(--discret)}

/* Les rendez-vous de l'après-midi : une carte par groupe, la réserve en pointillé */
.rdvs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.rdv{display:flex}
.carte-rdv{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--papier);border:1px solid var(--filet);border-radius:var(--r-l);padding:20px 22px;box-shadow:var(--ombre)}
.carte-rdv:hover{border-color:var(--discret)}
.rdv.reserve .carte-rdv{background:var(--papier-2);border-style:dashed;border-color:var(--filet-2);box-shadow:none}
.rdv-groupe{font-size:13px;font-weight:650;color:var(--orange-texte)}
.rdv.reserve .rdv-groupe{color:var(--discret)}
.rdv-client{font-size:18px;font-weight:650;letter-spacing:-.016em;line-height:1.25}
.rdv-client.manque{color:var(--discret)}
.rdv-infos{font-size:14px;color:var(--attenue)}
.rdv-profil{font-size:14px;line-height:1.45;color:var(--attenue);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rdv-etapes{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px}
.etape{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;line-height:1;padding:6px 10px 6px 8px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--filet-2);color:var(--discret);white-space:nowrap}
.etape::before{content:"";width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--discret);flex:none}
.etape.faite{background:var(--vert-teinte);box-shadow:none;color:var(--vert-texte)}
.etape.faite::before{background:var(--vert);box-shadow:none}

/* Qui fait quoi : le passage vers la feuille de route */
.fiche-route{align-self:flex-start;font-size:14px;margin-top:-4px}
.ca-role .ca-route{align-self:flex-start;margin-top:6px;font-size:14px}

/* Sujets : le classement, les points ; questions qui fâchent : mêmes cartes */
.classement-carte{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px 20px 18px}
.classement-texte{font-size:14.5px;line-height:1.5;color:var(--attenue)}
.sujet-points{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;font-weight:600;color:var(--discret);font-variant-numeric:tabular-nums}
.mon-rang{color:var(--encre)}
.sujet-reponse{padding-top:8px;border-top:1px solid var(--filet)}
.question-reponse{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.question.prete .carte-sujet{border-color:color-mix(in srgb,var(--vert) 35%,var(--filet))}

/* Feuille : un intertitre, le classement à toucher */
.champ-intertitre{margin:22px 0 2px;padding-top:18px;border-top:1px solid var(--filet);display:flex;flex-direction:column;gap:4px}
.champ-intertitre h3{font-size:16px;font-weight:700}
.classement-compte{font-size:13.5px;font-weight:600;color:var(--attenue);font-variant-numeric:tabular-nums}
.classement{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.classement-btn{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:center;padding:10px 14px 10px 10px;border-radius:12px;border:1.5px solid var(--filet-2);font-size:15px;line-height:1.35}
.classement-btn:hover{border-color:var(--discret)}
.classement-rang{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;box-shadow:inset 0 0 0 1.5px var(--filet-2);font-variant-numeric:tabular-nums}
.classement-btn.classe{border-color:var(--encre)}
.classement-btn.classe .classement-rang{background:var(--orange-plein);box-shadow:none;color:#FFFFFF}

/* Feuille de route */
.choix-personne .sommaire-lien.actif{background:var(--encre);border-color:var(--encre);color:var(--papier)}
.role-carte{padding:20px 24px;font-size:16.5px;line-height:1.5;max-width:none}
.route > li + li{border-top:1px solid var(--filet)}
.route-creneau{display:grid;grid-template-columns:148px minmax(0,1fr);gap:4px 20px;padding:18px 24px}
.route-heure{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;padding-top:1px}
.route-creneau.fort{box-shadow:inset 3px 0 0 var(--orange);background:linear-gradient(90deg,var(--orange-teinte),transparent 55%)}
.route-creneau.fort .route-heure{color:var(--orange-texte)}
.route-corps{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
.route-corps h3{font-size:17px;letter-spacing:-.012em}
.route-corps > p{font-size:15px;line-height:1.5;color:var(--attenue);max-width:68ch}
.route-corps .route-avec{font-size:13.5px;color:var(--discret)}

/* Documents pour Orange : une page de papier, le trait orange du logo en tête */
.document{align-self:flex-start;width:100%;max-width:820px;background:var(--papier);border:1px solid var(--filet);border-radius:var(--r-l);box-shadow:var(--ombre-haute);padding:48px 56px 52px;display:flex;flex-direction:column;gap:30px}
.doc-tete{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding-bottom:24px;border-bottom:2px solid var(--orange)}
.doc-tete .logo{height:24px;margin-bottom:18px}
.doc-titre{font-size:32px;font-weight:700;letter-spacing:-.032em;line-height:1.08}
.doc-titre::before{display:none}
.doc-sous{font-size:16px;color:var(--attenue)}
.doc-partie{display:flex;flex-direction:column;gap:12px}
.doc-partie h3{font-size:18px;font-weight:700;letter-spacing:-.015em}
.doc-partie h4{font-size:14px;font-weight:650;color:var(--discret);margin:0 0 6px}
.doc-programme > li{display:grid;grid-template-columns:158px minmax(0,1fr);gap:2px 18px;padding:10px 0;border-top:1px solid var(--filet);font-size:15.5px;line-height:1.4}
.doc-programme > li:first-child{border-top:0;padding-top:0}
.doc-heure{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.doc-ligne{display:flex;flex-direction:column;gap:2px;min-width:0}
.doc-quoi{font-weight:600}
.doc-qui{font-size:14px;color:var(--attenue)}
.doc-pause .doc-heure,.doc-pause .doc-quoi{font-weight:500;color:var(--discret)}
.doc-liste > li{padding:7px 0;border-top:1px solid var(--filet);font-size:15.5px;line-height:1.45}
.doc-liste > li:first-child{border-top:0;padding-top:0}
.doc-messages strong{font-weight:650}
.doc-texte{font-size:15.5px;line-height:1.55;color:var(--attenue);max-width:68ch}
.doc-colonnes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 32px}
.doc-decisions{display:flex;flex-direction:column;counter-reset:dec}
.doc-decisions > li{counter-increment:dec;position:relative;display:flex;flex-direction:column;gap:3px;padding:12px 0 12px 34px;border-top:1px solid var(--filet);font-size:15.5px;line-height:1.45}
.doc-decisions > li:first-child{border-top:0;padding-top:0}
.doc-decisions > li::before{content:counter(dec);position:absolute;left:0;top:11px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:#FFFFFF;background:var(--orange-plein)}
.doc-decisions > li:first-child::before{top:-1px}

/* Relevé : la saisie en direct, puis les décisions et leur suivi */
.releve-form{display:flex;flex-direction:column;gap:14px;padding:20px 24px 22px;border-color:var(--filet-2)}
.releve-form-titre{font-size:18px;font-weight:700;letter-spacing:-.015em}
.releve-form-titre::before{display:none}
.releve-champs{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.2fr) minmax(0,1fr);gap:12px}
.releve-champs .champ{margin:0}
.releve-bas{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.releve-bas .erreur{flex:1;min-width:12em}
.releve-bas .bouton{margin-left:auto}
.decisions-releve > li + li{border-top:1px solid var(--filet)}
.decision-releve{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:0 24px}
.decision-releve.suivie{grid-template-columns:24px minmax(0,1fr);gap:14px;align-items:start}
.decision-releve .coche{margin-top:14px}
.releve-corps{display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:14px 0;min-width:0}
.releve-corps:hover .item-texte{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--filet-2)}
.releve-quoi{font-weight:600}
.releve-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13.5px;color:var(--discret)}
.cote-orange{color:var(--orange-texte);font-weight:600}
.cote-lusko{color:var(--attenue);font-weight:600}
.p-visee{box-shadow:inset 0 0 0 1px var(--orange-texte);color:var(--orange-texte)}
.p-prise{background:var(--piste);color:var(--encre)}
.p-en_cours{background:rgba(47,111,222,.12);color:#2456B0}
:root[data-theme="dark"] .p-en_cours{background:rgba(108,155,242,.18);color:#A9C4F7}
.p-faite{background:var(--vert-teinte);color:var(--vert-texte)}
.decision-releve.en-retard .releve-pour{color:var(--rouge-texte);font-weight:600}
.releve-obtenue{white-space:nowrap;font-size:14px}
.vue-releve .document{box-shadow:var(--ombre)}

/* Remontées : le questionnaire et le retour aux équipes, côte à côte avec les réponses */
.retour-compte{font-size:14.5px;color:var(--attenue)}
.retour-compte strong{color:var(--encre);font-variant-numeric:tabular-nums}

@media (min-width:520px){
  .deux{grid-template-columns:1fr 1fr}
}
@media (min-width:720px){
  .voile{align-items:center;padding:24px}
  .feuille{border-radius:22px;max-height:86vh}
}
@media (min-width:1000px){
  .vue-afaire .sommaire{display:none}
}
@media screen and (max-width:999px){
  .deux-colonnes{grid-template-columns:minmax(0,1fr)}
  .remontees-grille{grid-template-columns:minmax(0,1fr);grid-template-areas:"lien" "reponses";gap:44px}
  .remontees-cote{position:static}
  .rdvs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .onglet .long{display:none}
  .onglet .court{display:inline}
  .duo-sections{grid-template-columns:minmax(0,1fr)}
  .fiches.trois{grid-template-columns:minmax(0,1fr)}
}
@media screen and (min-width:760px) and (max-width:999px){
  .onglet{padding:0 10px}
  .onglet svg{display:none}
  .barre-int{gap:0 20px}
}
@media screen and (max-width:759px){
  .barre-int{flex-wrap:wrap;padding:0 16px;gap:0 12px;min-height:0}
  .barre .marque{height:54px}
  .compte{align-self:center}
  .onglets{order:3;flex:1 0 100%;margin:0 -4px}
  .onglet{flex:1;justify-content:center;padding:10px 2px 12px;font-size:14px;gap:6px}
  .onglet::after{left:8px;right:8px}
  .page{padding:16px 16px 110px;gap:52px}
  .page.vue-accueil{gap:14px}
  .page-tete{padding-top:14px;margin-bottom:-16px}
  .sommaire{flex-wrap:nowrap;overflow-x:auto;align-self:stretch;margin:8px -16px 0;padding:0 16px 2px;scrollbar-width:none}
  .sommaire::-webkit-scrollbar{display:none}
  .sommaire-lien{flex:none}
  .section{scroll-margin-top:116px}
  .creneau{scroll-margin-top:124px}
  .banniere{grid-template-columns:minmax(0,1fr);gap:22px;padding:28px 22px 22px;border-radius:24px}
  .banniere-compte{flex-direction:row;align-items:flex-end;justify-content:space-between;text-align:left;gap:16px;padding-top:18px;border-top:1px solid rgba(255,255,255,.14)}
  .bn-jours{align-items:flex-start}
  .bn-stats{gap:16px;margin-top:0;padding-top:0;border-top:0}
  .cartes-accueil{grid-template-columns:minmax(0,1fr);gap:14px}
  .carte-accueil{padding:22px 20px 20px}
  .frise-cadre{display:none}
  .fiches{grid-template-columns:minmax(0,1fr);gap:12px}
  .creneau-tete{grid-template-columns:50px minmax(0,1fr) 12px;gap:4px 12px;padding:14px 16px}
  .creneau-corps{flex-direction:column;align-items:flex-start;gap:7px}
  .creneau-qui{justify-content:flex-start;max-width:none}
  .creneau-duree{display:none}
  .creneau-detail{padding:0 16px 16px 78px}
  .fiche,.fiche .ref-btn{padding:18px 18px 16px;gap:12px}
  .fiche-bas{padding-top:12px}
  .mono{width:40px;height:40px;font-size:13.5px}
  .fiche-nom{font-size:17px}
  .fiche.modifiable{padding:0}
  .groupe-tete{padding:14px 16px 4px}
  .liste > li{padding-left:16px}
  .item-corps{padding-right:16px}
  .bascule{padding:14px 16px}
  .regles > li.ref:not(.modifiable),.notes > li,.regles .ref-btn{padding:14px 18px 14px 38px}
  .regles > li::before,.notes > li::before{left:17px;top:23px}
  .rdvs{grid-template-columns:minmax(0,1fr);gap:12px}
  .carte-rdv{padding:18px 18px 16px}
  .avancement{grid-template-columns:auto minmax(0,1fr);padding:14px 16px}
  .avancement-aide{grid-column:1 / -1}
  .chiffre-btn{padding:14px 18px}
  .route-creneau{grid-template-columns:minmax(0,1fr);padding:16px 18px}
  .role-carte{padding:18px}
  .document{padding:28px 20px 30px;gap:24px;border-radius:var(--r-m)}
  .doc-titre{font-size:26px}
  .doc-programme > li{grid-template-columns:minmax(0,1fr)}
  .doc-colonnes{grid-template-columns:minmax(0,1fr)}
  .releve-form{padding:18px 16px}
  .releve-champs{grid-template-columns:minmax(0,1fr)}
  .releve-bas .bouton{margin-left:0;width:100%}
  .decision-releve{grid-template-columns:minmax(0,1fr);padding:0 16px}
  .decision-releve.visee .releve-obtenue{justify-self:start;margin:-6px 0 14px}
  .decision-releve.suivie{grid-template-columns:24px minmax(0,1fr)}
  .colonne{gap:52px}
}
@media screen and (max-width:459px){
  .onglet svg{display:none}
  .onglet{font-size:13.5px;letter-spacing:-.01em}
  .lien-ligne{flex-direction:column}
  .bn-stats{flex-direction:column;gap:6px}
  .bn-stat{flex-direction:row;align-items:baseline;gap:6px;justify-content:flex-end}
  .ca-suite-btn{grid-template-columns:92px minmax(0,1fr)}
}

@keyframes monte{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes leve{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes apparait{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:no-preference){
  .voile{animation:apparait .18s ease both}
  .feuille{animation:leve .32s var(--ease) both}
  .compte-menu{animation:apparait .15s ease both}
  .page.entree > *{animation:monte .5s var(--ease) both}
  .page.entree > :nth-child(3){animation-delay:.06s}
  .page.entree > :nth-child(n+4){animation-delay:.12s}
}

/* Connexion par lien et code, avant l'ouverture de l'espace */
body.hors-session #app{display:none}
.connexion{min-height:100vh;display:grid;place-items:center;padding:32px 16px;background:var(--fond)}
.connexion-carte{width:min(470px,100%);background:var(--papier);border:1px solid var(--filet);border-radius:24px;padding:34px 36px 30px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 30px 60px -32px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:14px}
.connexion-marque{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.connexion h1{font-size:29px;line-height:1.15;letter-spacing:-.028em;margin-top:0}
.connexion-texte{color:var(--attenue);font-size:16px;line-height:1.5}
.connexion-form{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.connexion-lib{font-size:15px;font-weight:650}
.connexion-champ{width:100%;font-size:17px;padding:14px 16px;border:1px solid var(--filet-2);border-radius:12px;background:var(--papier-2);color:var(--encre)}
.connexion-champ:focus{outline:none;border-color:var(--encre);box-shadow:0 0 0 4px var(--piste)}
.connexion-champ.code{font-size:26px;font-weight:650;letter-spacing:.32em;text-align:center;font-variant-numeric:tabular-nums;padding:12px 16px}
.connexion-bouton{margin-top:6px;border:0;border-radius:12px;padding:15px 18px;font-size:16px;font-weight:650;color:#FFFFFF;background:linear-gradient(135deg,#2C2C30,#111113);box-shadow:0 12px 26px -14px rgba(0,0,0,.7),inset 0 -2px 0 var(--orange)}
.connexion-bouton:hover{background:linear-gradient(135deg,#3A3A40,#1D1D1F)}
.connexion-bouton:disabled{opacity:.6;cursor:default}
:root[data-theme="dark"] .connexion-bouton{background:linear-gradient(135deg,#F5F5F7,#D9D9DE);color:#111113}
.connexion-note{border-radius:12px;padding:13px 15px;font-size:15px;line-height:1.45}
.connexion-note.succes{background:var(--vert-teinte);color:var(--vert-texte)}
.connexion-note.erreur{background:var(--rouge-teinte);color:var(--rouge-texte)}
.connexion-erreurs:empty{display:none}
.connexion-petit{font-size:13.5px;color:var(--discret);line-height:1.5;margin-top:4px}
.connexion-lien{border:0;background:none;padding:0;font:inherit;color:var(--encre);text-decoration:underline;text-underline-offset:3px}
.connexion-attente{display:flex;align-items:center;gap:12px;color:var(--attenue);font-size:15px;padding:8px 0}
.rond{width:18px;height:18px;border-radius:50%;border:2px solid var(--piste);border-top-color:var(--orange);animation:tourne .8s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:no-preference){
  .connexion-carte{animation:monte .6s var(--ease) both}
}
@media (max-width:520px){
  .connexion{place-items:start center;padding-top:8vh}
  .connexion-carte{padding:28px 22px 24px;border-radius:20px}
  .connexion h1{font-size:26px}
}

  /* ---------- Petits outils ---------- */

  function el(balise, attrs, enfants) {
    var n = document.createElement(balise);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;

    return n;
  }
  function lire(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function ecrire(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* mémoire indisponible */ } }
  function attendre(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function normaliserEmail(s) { return String(s || "").trim().toLowerCase(); }
  function emailValide(s) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s); }
  function initiales(nom, email) {
    var base = String(nom || "").trim() || String(email || "").split("@")[0].replace(/[._-]+/g, " ");
    var mots = base.split(/\s+/).filter(Boolean);

  function nouvelId() {

  // Traduit les erreurs de Supabase dans les codes que la page du plan connaît déjà.

  /* ---------- Écran de connexion ---------- */

  var ecran = null;

  }
  function carte(enfants) {
    var e = monterEcran();
    while (e.firstChild) e.removeChild(e.firstChild);
    var c = el("div", { class: "connexion-carte" }, [
      el("div", { class: "connexion-marque" }, [
        el("span", { class: "logo", role: "img", "aria-label": "LUSKO" }),
        el("span", { class: "marque-sep", "aria-hidden": "true" }),
        el("span", { class: "marque-bu", text: "BU Orange" })

    e.appendChild(c);

  function message(texte, genre) { return el("p", { class: "connexion-note " + (genre || "info"), role: genre === "erreur" ? "alert" : "status", text: texte }); }

  function ecranChargement(texte) {
    carte([el("p", { class: "connexion-attente", role: "status" }, [el("span", { class: "rond", "aria-hidden": "true" }), texte || "Ouverture de l'espace"])]);
  }

  function ecranAdresse(erreur) {
    var champ = el("input", { class: "connexion-champ", id: "connexion-email", type: "email", name: "email", autocomplete: "email", inputmode: "email", required: true, placeholder: "prenom.nom@entreprise.fr", value: lire("espace-dernier-email") || "" });
    var bouton = el("button", { class: "connexion-bouton", type: "submit", text: "Recevoir mon lien de connexion" });
    var zone = el("div", { class: "connexion-erreurs" }, erreur ? [message(erreur, "erreur")] : []);
    var form = el("form", { class: "connexion-form", novalidate: true, onsubmit: function (e) {
      e.preventDefault();
      var email = normaliserEmail(champ.value);
      while (zone.firstChild) zone.removeChild(zone.firstChild);
      if (!emailValide(email)) { zone.appendChild(message("Saisissez une adresse mail complète, par exemple prenom.nom@entreprise.fr.", "erreur")); champ.focus(); return; }
      bouton.disabled = true;
      bouton.textContent = "Envoi en cours";

        if (r.ok) { ecrire("espace-dernier-email", email); ecranCode(email); return; }
        bouton.disabled = false;
        bouton.textContent = "Recevoir mon lien de connexion";
        zone.appendChild(message(r.texte, "erreur"));
      });
    } }, [
      el("label", { class: "connexion-lib", for: "connexion-email", text: "Adresse mail professionnelle" }),
      champ,
      zone,
      bouton
    ]);
    carte([
      el("h1", { text: "Votre espace projet" }),
      el("p", { class: "connexion-texte", text: "Saisissez votre adresse professionnelle : vous recevrez un lien de connexion et un code, sans mot de passe à retenir." }),
      form
    ]);
  }

  function envoyerLien(email) {
    return Promise.resolve().then(function () {
      return sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: true, emailRedirectTo: SITE } });
    }).then(function (res) {
      var err = res && res.error;
      if (!err) return { ok: true };
      var statut = Number(err.status) || 0;
      // Une adresse non invitée reçoit la même réponse qu'une adresse invitée : la page ne dit pas qui a un accès.
      if (statut === 429 || err.code === "over_email_send_rate_limit" || err.code === "over_request_rate_limit") return { ok: false, texte: "Un lien vient déjà de partir. Patientez une minute avant d'en redemander un." };

  }

  function ecranCode(email, erreur) {
    var champ = el("input", { class: "connexion-champ code", id: "connexion-code", type: "text", name: "code", autocomplete: "one-time-code", inputmode: "numeric", maxlength: "10", required: true, "aria-describedby": "connexion-aide" });
    var bouton = el("button", { class: "connexion-bouton", type: "submit", text: "Ouvrir l'espace projet" });
    var zone = el("div", { class: "connexion-erreurs" }, erreur ? [message(erreur, "erreur")] : []);
    var form = el("form", { class: "connexion-form", novalidate: true, onsubmit: function (e) {
      e.preventDefault();
      var code = String(champ.value || "").replace(/\D+/g, "");
      while (zone.firstChild) zone.removeChild(zone.firstChild);
      if (code.length < 6) { zone.appendChild(message("Recopiez le code du mail en entier.", "erreur")); champ.focus(); return; }
      bouton.disabled = true;
      bouton.textContent = "Vérification";
      Promise.resolve().then(function () { return sb.auth.verifyOtp({ email: email, token: code, type: "email" }); }).then(function (res) {
        if (res && !res.error && res.data && res.data.session) { ouvrirEspace(res.data.session); return; }
        bouton.disabled = false;
        bouton.textContent = "Ouvrir l'espace projet";
        var statut = res && res.error ? Number(res.error.status) || 0 : 0;
        zone.appendChild(message(statut === 0 ? "Connexion impossible pour le moment. Vérifiez votre réseau, puis réessayez." : (statut === 429 ? "Trop d'essais rapprochés. Patientez une minute, puis réessayez." : "Ce code n'est pas valable : il est erroné, il a expiré ou il a déjà servi. Vérifiez-le, ou demandez un nouveau lien."), "erreur"));
        champ.select();
      }, function () {
        bouton.disabled = false;
        bouton.textContent = "Ouvrir l'espace projet";
        zone.appendChild(message("Connexion impossible pour le moment. Vérifiez votre réseau, puis réessayez.", "erreur"));
      });
    } }, [
      el("label", { class: "connexion-lib", for: "connexion-code", text: "Ou saisissez le code reçu" }),
      champ,
      zone,
      bouton
    ]);
    carte([
      el("h1", { text: "Votre espace projet" }),
      el("p", { class: "connexion-texte", text: "Saisissez votre adresse professionnelle : vous recevrez un lien de connexion et un code, sans mot de passe à retenir." }),
      message("Si " + email + " a accès à un espace projet, un lien vient d'y être envoyé. Il est valable une heure.", "succes"),
      form,
      el("p", { class: "connexion-petit", id: "connexion-aide" }, [
        "Rien reçu après une minute ? Regardez dans les courriers indésirables, ou ",
        el("button", { class: "connexion-lien", type: "button", text: "recommencez", onclick: function () { ecranAdresse(); } }),
        "."
      ])

  }

  // Le lien du mail mène ici. On attend le clic de la personne avant de consommer le jeton.
  function ecranLien(jeton, type) {
    var bouton = el("button", { class: "connexion-bouton", type: "button", text: "Ouvrir l'espace projet", onclick: function () {
      bouton.disabled = true;
      bouton.textContent = "Vérification";
      Promise.resolve().then(function () { return sb.auth.verifyOtp({ token_hash: jeton, type: type }); }).then(function (res) {
        nettoyerAdresse();
        if (res && !res.error && res.data && res.data.session) { ouvrirEspace(res.data.session); return; }
        ecranAdresse("Ce lien a expiré ou a déjà servi. Demandez-en un nouveau ci-dessous, ou saisissez le code du mail.");
      }, function () {
        bouton.disabled = false;
        bouton.textContent = "Ouvrir l'espace projet";
      });
    } });
    carte([
      el("h1", { text: "Ouvrir l'espace projet" }),
      el("p", { class: "connexion-texte", text: "Votre lien de connexion est prêt. Il ne sert qu'une fois." }),
      bouton
    ]);
  }

  function ecranSansAcces(email) {
    carte([
      el("h1", { text: "Pas encore d'accès" }),
      el("p", { class: "connexion-texte", text: "L'adresse " + email + " n'a pas accès à cet espace. Demandez une invitation à la personne qui l'anime, puis reconnectez-vous." }),
      el("button", { class: "connexion-bouton", type: "button", text: "Changer d'adresse", onclick: deconnecter })

  }

  function ecranIndisponible(reprendre) {
    carte([
      el("h1", { text: "L'espace ne répond pas" }),
      el("p", { class: "connexion-texte", text: "La connexion au serveur a échoué. Vérifiez votre réseau, puis réessayez." }),

  }

    ecrire("pvo-identite", "");
    return Promise.resolve().then(function () { return sb.auth.signOut(); }).catch(function () { /* déjà déconnecté */ }).then(function () {
      location.replace(location.pathname);
    });
  }

  /* ---------- Ouverture de l'espace ---------- */

  function ouvrirEspace(session) {
    var email = normaliserEmail(session && session.user && session.user.email);
    ecranChargement();
    return Promise.resolve().then(function () {
      return sb.from("membres").select("email,nom,intervenant,role").eq("espace", ESPACE).eq("email", email).maybeSingle();
    }).then(function (res) {
      if (res && res.error) { ecranIndisponible(function () { ouvrirEspace(session); }); return; }
      var m = res && res.data;
      if (!m) { ecranSansAcces(email); return; }
      sb.rpc("lier_mon_compte", { p_espace: ESPACE }).then(null, function () { /* sans trace de connexion */ });
      plateforme.compte = { id: session.user.id, email: email, nom: m.nom || "", intervenant: m.intervenant || "", role: m.role, initiales: initiales(m.nom, email) };
      if (m.intervenant) { ecrire("pvo-identite", m.intervenant); if (!lire("pvo-focus")) ecrire("pvo-focus", m.intervenant); }

      plateforme.remontees = remonteesApi();

  /* ---------- La base partagée, sous la forme que la page attend ---------- */

  var memoire = {}, ecouteurs = {}, etat = "attente", canal = null, dejaAbonne = false;

  function instantane(c) {

  }

  function toutCharger() {
    var lignes = [];
    function page(depuis) {
      return sb.from("documents").select("collection,id,data").eq("espace", ESPACE).order("collection").order("id").range(depuis, depuis + PAGE - 1).then(function (res) {
        if (res.error) throw res.error;
        lignes = lignes.concat(res.data || []);
        return (res.data || []).length === PAGE ? page(depuis + PAGE) : lignes;
      });
    }
    return page(0).then(function (toutes) {
      COLLECTIONS.forEach(function (c) { memoire[c] = {}; });
      toutes.forEach(function (l) { if (memoire[l.collection] && l.data && typeof l.data === "object") memoire[l.collection][l.id] = l.data; });

  }
  function chargerAvecReprise(essai) {
    return toutCharger().catch(function (err) {

        return;

      return attendre(800 * (essai + 1)).then(function () { return chargerAvecReprise(essai + 1); });
    });

  function surChangement(p) {
    var neuf = p.new && p.new.collection ? p.new : null, ancien = p.old || {};
    if (p.eventType === "DELETE") {
      if (ancien.espace && ancien.espace !== ESPACE) return;
      if (!memoire[ancien.collection] || !memoire[ancien.collection][ancien.id]) return;
      delete memoire[ancien.collection][ancien.id];
      prevenir(ancien.collection);
      return;
    }
    if (!neuf || neuf.espace !== ESPACE || !memoire[neuf.collection]) return;
    memoire[neuf.collection][neuf.id] = neuf.data;
    prevenir(neuf.collection);
  }
  function ecouterChangements() {
    if (canal) return;
    canal = sb.channel("espace-" + ESPACE)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "documents", filter: "espace=eq." + ESPACE }, surChangement)
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "documents", filter: "espace=eq." + ESPACE }, surChangement)
      .on("postgres_changes", { event: "DELETE", schema: "public", table: "documents" }, surChangement)

  function refDoc(chemin) {

        return Promise.resolve({ id: id, exists: !!d, data: function () { return d; } });

      set: function (data) {
        return sb.from("documents").insert({ espace: ESPACE, collection: c, id: id, data: data }).then(function (res) {
          if (!res.error) return;
          if (res.error.code !== "23505") return rejet(res.error);

        });
      },
      update: function (champs) {
        return sb.rpc("maj_document", { p_espace: ESPACE, p_collection: c, p_id: id, p_champs: champs }).then(function (res) { if (res.error) return rejet(res.error); });
      },
      delete: function () {
        return sb.from("documents").delete().eq("espace", ESPACE).eq("collection", c).eq("id", id).then(function (res) { if (res.error) return rejet(res.error); });

  var base = {
    doc: refDoc,
    collection: function (c) {

        path: c,

  /* ---------- Le lecteur, les téléchargements ---------- */

  var lecteur = {
    can: function () { var r = plateforme.compte && plateforme.compte.role; return Promise.resolve(r === "edition" || r === "admin"); },
    canEdit: function () { return lecteur.can(); },
    isOwner: function () { return Promise.resolve(!!(plateforme.compte && plateforme.compte.role === "admin")); },
    id: function () { return Promise.resolve(plateforme.compte ? plateforme.compte.id : null); },
    me: function () {
      var c = plateforme.compte || {};
      return Promise.resolve({ id: c.id || null, name: c.nom || c.email || "", email: c.email || null, isOwner: c.role === "admin", canEdit: c.role === "edition" || c.role === "admin" });
    },
    profiles: function (ids) {
      var liste = [].concat(ids || []).filter(Boolean);
      if (!liste.length) return Promise.resolve({});
      return sb.from("membres").select("user_id,nom,email").eq("espace", ESPACE).in("user_id", liste).then(function (res) {
        var r = {};
        liste.forEach(function (i) { r[i] = { id: i, name: "" }; });
        (res.data || []).forEach(function (m) { r[m.user_id] = { id: m.user_id, name: m.nom || m.email }; });
        return r;
      });
    }
  };

  var telechargements = {
    save: function (req) {
      try {
        var nom = String(req.filename || "fichier.html");
        var blob = req.data instanceof Blob ? req.data : new Blob([req.data], { type: /\.html$/i.test(nom) ? "text/html;charset=utf-8" : "application/octet-stream" });
        var url = URL.createObjectURL(blob);
        var a = el("a", { href: url, download: nom });
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(url); if (a.parentNode) a.parentNode.removeChild(a); }, 1000);
        return Promise.resolve({ status: "saved" });
      } catch (e) { return Promise.reject({ code: "unavailable", message: String(e) }); }
    }
  };

  function utiliser(nom) {
    if (nom === "db") return Promise.resolve(base);
    if (nom === "user") return Promise.resolve(lecteur);
    if (nom === "downloads") return Promise.resolve(CONFIG.apercu ? null : telechargements);
    return Promise.resolve(null);
  }

  /* ---------- Les membres de l'espace (onglet Équipe) ---------- */

  // Les réponses anonymes au questionnaire : lecture par les membres, retrait par un administrateur.
  function remonteesApi() {
    return {
      lister: function () {
        return Promise.resolve().then(function () {
          return sb.from("remontees").select("id,recu_le,metier,reponses").eq("espace", ESPACE).order("recu_le", { ascending: false });
        }).then(function (res) {
          if (res && res.error) return rejet(res.error);
          return (res && res.data) || [];
        });
      },
      supprimer: function (id) {
        return Promise.resolve().then(function () {
          return sb.from("remontees").delete().eq("espace", ESPACE).eq("id", id).select("id");
        }).then(function (res) {
          if (res && res.error) return rejet(res.error);
          if (!res || !res.data || !res.data.length) return Promise.reject({ code: "not_granted", message: "" });
        });
      }
    };
  }

  function membresApi() {
    function verifier(res) { if (res && res.error) return rejet(res.error); return res ? res.data : null; }
    return {
      lister: function () {
        return sb.from("membres").select("email,nom,intervenant,role,user_id,invite_le,vu_le").eq("espace", ESPACE).order("nom").then(verifier);
      },
      ajouter: function (m) {
        return sb.from("membres").insert({ espace: ESPACE, email: normaliserEmail(m.email), nom: String(m.nom || "").trim(), intervenant: m.intervenant || null, role: m.role || "edition" }).then(verifier);
      },

  // Toucher les sujets dans l'ordre de préférence ; toucher un sujet classé le retire.
  function champClassement(c) {
    var max = c.max || 5, connus = c.options.map(function (o) { return o[0]; });
    var rang = tableau(c.valeur).filter(function (x) { return connus.indexOf(x) >= 0; }).slice(0, max);
    var cache = el("input", { type: "hidden", name: c.cle });
    var compteur = el("p", { class: "classement-compte", "aria-live": "polite" });
    var ol = el("ol", { class: "classement" });
    function dessiner(focus) {
      cache.value = rang.join(",");
      compteur.textContent = rang.length + " sur " + max + (rang.length > 1 ? " choisis" : " choisi");
      ol.textContent = "";
      c.options.forEach(function (o) {
        var i = rang.indexOf(o[0]);
        ol.appendChild(el("li", {}, [el("button", { type: "button", class: "classement-btn" + (i >= 0 ? " classe" : ""), "aria-pressed": i >= 0 ? "true" : "false", "aria-label": (i >= 0 ? "Classé numéro " + (i + 1) + " : " : "") + o[1], "data-cle": "classer-" + o[0], onclick: function () {
          var j = rang.indexOf(o[0]);
          if (j >= 0) rang.splice(j, 1);
          else if (rang.length < max) rang.push(o[0]);
          else { compteur.textContent = max + " sujets au plus : touchez un sujet classé pour le retirer."; return; }
          dessiner(o[0]);
        } }, [el("span", { class: "classement-rang", "aria-hidden": "true", text: i >= 0 ? String(i + 1) : "" }), el("span", { class: "classement-texte", text: o[1] })])]));
      });
      if (focus) { var n = ol.querySelector('[data-cle="classer-' + focus + '"]'); if (n) { try { n.focus(); } catch (e) { /* sans focus */ } } }
    }
    dessiner();
    return el("fieldset", { class: "champ" }, [el("legend", { class: "champ-lib", text: c.lib }), c.aide ? el("p", { class: "champ-aide", text: c.aide }) : null, compteur, ol, cache]);
  }
  function valeurs(form, champs) {
    var v = {};
    champs.forEach(function (c) {
      if (c.type === "intertitre") return;
      if (c.type === "classement") v[c.cle] = String(form.elements[c.cle].value || "").split(",").filter(Boolean);
      else if (c.type === "qui") v[c.cle] = [].slice.call(form.querySelectorAll('input[name="' + c.cle + '"]:checked')).map(function (b) { return b.value; });
      else if (c.type === "choix") { var r = form.querySelector('input[name="' + c.cle + '"]:checked'); v[c.cle] = r ? r.value : c.options[0][0]; }
      else if (c.type === "case") v[c.cle] = !!(form.elements[c.cle] && form.elements[c.cle].checked);
      else if (c.type === "lignes") v[c.cle] = String(form.elements[c.cle].value || "").split(/\n+/).map(function (l) { return l.trim(); }).filter(Boolean);
      else v[c.cle] = String(form.elements[c.cle].value || "").trim();
    });
    return v;
  }

  function ouvrirFeuille(opts) {
    var retour = document.activeElement;
    fermerFeuille();
    var erreurs = el("p", { class: "feuille-erreur", role: "alert" });
    var corps = [];
    if (opts.lecture) {
      corps.push(el("dl", { class: "lecture" }, opts.lecture.filter(function (l) { return l && txt(l[1]); }).map(function (l) {
        return el("div", { class: "lecture-ligne" }, [el("dt", { text: l[0] }), el("dd", { text: l[1] })]);
      })));
    }
    (opts.champs || []).forEach(function (c) { corps.push(champ(c)); });
    if (opts.contenu) corps.push(opts.contenu);
    var boutons = [];
    if (opts.enregistrer) boutons.push(el("button", { type: "submit", class: "bouton", "data-cle": "enregistrer", text: opts.libelleEnregistrer || "Enregistrer" }));
    boutons.push(el("button", { type: "button", class: "bouton secondaire", "data-cle": "fermer", text: opts.enregistrer ? "Annuler" : "Fermer", onclick: fermerFeuille }));
    if (opts.supprimer) {
      var confirme = false;
      boutons.push(el("button", { type: "button", class: "bouton danger", "data-cle": "supprimer", text: "Supprimer", onclick: function (e) {
        var b = e.currentTarget;
        if (!confirme) { confirme = true; b.textContent = "Confirmer la suppression"; return; }
        b.disabled = true;
        opts.supprimer().then(fermerFeuille, function (err) { b.disabled = false; erreurs.textContent = messageErreur(err); });
      } }));
    }
    var form = el("form", { class: "feuille", role: "dialog", "aria-modal": "true", "aria-labelledby": "feuille-titre", novalidate: true, onclick: stop }, [
      el("div", { class: "feuille-tete" }, [
        el("h2", { id: "feuille-titre", text: opts.titre }),
        el("button", { type: "button", class: "feuille-fermer", "aria-label": "Fermer", "data-cle": "croix", onclick: fermerFeuille })
      ]),
      el("div", { class: "feuille-corps" }, corps),
      erreurs,
      el("div", { class: "feuille-pied" }, boutons)
    ]);
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!opts.enregistrer) return;
      var v = valeurs(form, opts.champs || []);
      var manque = (opts.champs || []).filter(function (c) { return c.requis && !txt(v[c.cle]); })[0];

      var envoi = form.querySelector('[type="submit"]');

      erreurs.textContent = "";
      Promise.resolve().then(function () { return opts.enregistrer(v); }).then(fermerFeuille, function (err) {
        if (envoi) envoi.disabled = false;
        erreurs.textContent = (err && err.texte) || messageErreur(err);
      });
    });
    var voile = el("div", { class: "voile", onclick: fermerFeuille }, [form]);
    document.body.appendChild(voile);
    document.body.classList.add("feuille-ouverte");
    feuille = { voile: voile, retour: retour };
    var premier = form.querySelector(".feuille-corps input:not([type=checkbox]):not([type=radio]):not([type=hidden]), .feuille-corps textarea") || form.querySelector(".feuille-fermer");
    if (premier && premier.focus) { try { premier.focus(); } catch (e) { /* sans focus */ } }
  }
