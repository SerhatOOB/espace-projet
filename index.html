  };
  function identifiantLibre(nom) {
    var base = String(nom || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 30) || "personne";
    var id = base, n = 2;
    while ((etat.donnees.intervenants || {})[id] || id === "tous") { id = base + "-" + n; n += 1; }
    return id;
  }
  function ouvrirRef(c, item) {
    var def = REFS[c], nouveau = !item;
    var champs = def.champs.map(function (d) { return { cle: d[0], lib: d[1], type: d[2], requis: !!d[3], valeur: item ? item[d[0]] : "" }; });
    ouvrirFeuille({ titre: def.titre, champs: champs, libelleEnregistrer: nouveau ? "Ajouter" : "Enregistrer",
      enregistrer: function (v) {
        if (!nouveau) return modifier(c, item.id, v);
        var data = Object.assign(v, { ordre: ordreSuivant(c) });
        if (c === "intervenants") return db.doc("intervenants/" + identifiantLibre(v.nom)).set(data);
        return creer(c, data);
      },
      supprimer: nouveau ? null : function () { return supprimer(c, item.id); } });
  }
  function ouvrirInfos() {
    var inf = infos();
    var champs = [
      { cle: "but", lib: "Le but de la visite", type: "long", valeur: inf.but, lignes: 3 },
      { cle: "date", lib: "Date de la visite", type: "date", valeur: inf.date },
      { cle: "lieu", lib: "Lieu", type: "texte", valeur: inf.lieu },
      { cle: "point_etape", lib: "Point d'étape avec Orange", type: "date", valeur: inf.point_etape },
      { cle: "notes", lib: "À savoir, un point par ligne", type: "lignes", valeur: inf.notes, lignes: 5 }
    ];
    ouvrirFeuille({ titre: "La visite", champs: champs, enregistrer: function (v) {
      if ((etat.donnees.general || {}).infos) return modifier("general", "infos", v);
      return db.doc("general/infos").set(Object.assign({ titre: P.titre || "" }, v));
    } });
  }

  /* ---------- Accès (administrateur) ---------- */

  function lienInvitation(m) {
    var prenom = String(m.nom || "").trim().split(/\s+/)[0];
    var signe = compte.nom ? compte.nom.trim().split(/\s+/)[0] : "";
    var sujet = "Espace projet : " + (txt(infos().titre) || P.titre || "visite Orange");
    var corps = "Bonjour" + (prenom ? " " + prenom : "") + ",\n\nVoici l'espace de préparation de la visite : " + (P.site || "") + "\n\nConnecte-toi avec ton adresse professionnelle, " + m.email + " : tu recevras un lien et un code par mail, sans mot de passe à retenir.\n\n" + signe;
    return "mailto:" + m.email + "?subject=" + encodeURIComponent(sujet) + "&body=" + encodeURIComponent(corps);
  }
  function ouvrirAcces() {
    var zone = el("div", { class: "acces" }, [el("p", { class: "chargement", text: "Chargement des accès" })]);
    ouvrirFeuille({ titre: "Qui a accès", contenu: zone });
    chargerMembres(zone, {});
  }
  function chargerMembres(zone, brouillon) {
    if (!P.membres) return;
    P.membres.lister().then(function (membres) { rendreAcces(zone, membres || [], brouillon); }, function () {
      zone.textContent = "";
      zone.appendChild(el("p", { class: "feuille-erreur", text: "La liste des accès ne s'est pas chargée. Réessayez dans un instant." }));
    });
  }
  function rendreAcces(zone, membres, brouillon) {
    var moi = String(compte.email || "").toLowerCase();
    membres = membres.slice().sort(function (a, b) {
      if (a.email === moi) return -1; if (b.email === moi) return 1;
      return String(a.nom || a.email).localeCompare(String(b.nom || b.email), "fr");
    });
    zone.textContent = "";
    zone.appendChild(el("ul", { class: "membres" }, membres.map(function (m) {
      var soi = m.email === moi;
      var droit = el("select", { class: "saisie petite", "aria-label": "Droit de " + (m.nom || m.email), "data-cle": "role-" + m.email, disabled: soi }, DROITS.map(function (d) {
        var o = el("option", { value: d[0], text: d[1] });
        if (d[0] === m.role) o.selected = true;
        return o;
      }));
      droit.addEventListener("change", function () {
        droit.disabled = true;
        P.membres.modifier(m.email, { role: droit.value }).then(function () { chargerMembres(zone, brouillon); }, function () { chargerMembres(zone, brouillon); });
      });
      var confirme = false;
      var retirer = soi ? null : el("button", { type: "button", class: "lien-action danger", "data-cle": "retirer-" + m.email, text: "Retirer", onclick: function (e) {
        var b = e.currentTarget;
        if (!confirme) { confirme = true; b.textContent = "Confirmer le retrait"; return; }
        b.disabled = true;
        P.membres.retirer(m.email).then(function () { chargerMembres(zone, brouillon); }, function () { chargerMembres(zone, brouillon); });
      } });
      return el("li", { class: "membre" }, [
        el("div", { class: "membre-qui" }, [
          el("span", { class: "membre-nom", text: (m.nom || m.email) + (soi ? " (vous)" : "") }),
          el("span", { class: "membre-email", text: m.email }),
          el("span", { class: "membre-etat", text: vuLe(m.vu_le) })
        ]),
        el("div", { class: "membre-actions" }, [
          droit,
          el("a", { class: "lien-action", href: lienInvitation(m), "data-cle": "inviter-" + m.email, text: "Inviter" }),
          retirer
        ])
      ]);
    })));
    zone.appendChild(formulaireMembre(zone, membres, brouillon));
  }
  function formulaireMembre(zone, membres, brouillon) {
    var erreur = el("p", { class: "erreur", role: "alert" });
    var email = el("input", { class: "saisie", type: "email", id: "membre-email", "data-cle": "membre-email", autocomplete: "off", placeholder: "prenom.nom@entreprise.fr" });
    var nom = el("input", { class: "saisie", type: "text", id: "membre-nom", "data-cle": "membre-nom", autocomplete: "off" });
    var interv = el("select", { class: "saisie", id: "membre-intervenant", "data-cle": "membre-intervenant" }, [el("option", { value: "", text: "Aucun" })].concat(intervenants().map(function (i) { return el("option", { value: i.id, text: txt(i.nom) || i.id }); })));
    var droit = el("select", { class: "saisie", id: "membre-droit", "data-cle": "membre-droit" }, DROITS.map(function (d) { var o = el("option", { value: d[0], text: d[1] }); if (d[0] === "edition") o.selected = true; return o; }));
    email.value = brouillon.email || ""; nom.value = brouillon.nom || ""; interv.value = brouillon.intervenant || ""; droit.value = brouillon.role || "edition";
    [email, nom].forEach(function (n) { n.addEventListener("input", function () { brouillon[n === email ? "email" : "nom"] = n.value; }); });
    interv.addEventListener("change", function () { brouillon.intervenant = interv.value; });
    droit.addEventListener("change", function () { brouillon.role = droit.value; });
    var form = el("form", { class: "membre-form", novalidate: true }, [
      el("h3", { class: "sous-titre", text: "Donner l'accès à quelqu'un" }),
      el("div", { class: "champ" }, [el("label", { class: "champ-lib", for: "membre-email", text: "Adresse mail professionnelle" }), email]),
      el("div", { class: "champ" }, [el("label", { class: "champ-lib", for: "membre-nom", text: "Nom" }), nom]),
      el("div", { class: "deux" }, [
        el("div", { class: "champ" }, [el("label", { class: "champ-lib", for: "membre-intervenant", text: "Son rôle sur le plan" }), interv]),
        el("div", { class: "champ" }, [el("label", { class: "champ-lib", for: "membre-droit", text: "Droit" }), droit])
      ]),
      erreur,
      el("button", { type: "submit", class: "bouton", text: "Donner l'accès" })
    ]);
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var adresse = String(email.value || "").trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(adresse)) { erreur.textContent = "Saisissez une adresse mail complète."; email.focus(); return; }
      if (membres.some(function (m) { return m.email === adresse; })) { erreur.textContent = "Cette adresse a déjà accès à l'espace."; return; }
      var envoi = form.querySelector('[type="submit"]');
      envoi.disabled = true;
      P.membres.ajouter({ email: adresse, nom: nom.value, intervenant: interv.value, role: droit.value }).then(function () {
        brouillon.email = ""; brouillon.nom = ""; brouillon.intervenant = ""; brouillon.role = "edition";
        chargerMembres(zone, brouillon);
      }, function (err) {
        envoi.disabled = false;
        erreur.textContent = err && err.code === "already_exists" ? "Cette adresse a déjà accès à l'espace." : "L'accès n'a pas été donné. Vérifiez votre connexion, puis réessayez.";
      });
    });
    return form;
  }

  /* ---------- Impression, sauvegarde ---------- */

  // Depuis le menu, le programme complet, chaque créneau déplié. Depuis une feuille de route ou un document pour Orange,
  // cette page seule. Puis la page revient comme avant.
  function imprimer(vue) {
    etat.vue = typeof vue === "string" ? vue : "jour";
    etat.impression = true;
    rendre();
    var fini = false;
    function retour() { if (fini) return; fini = true; window.removeEventListener("afterprint", retour); etat.impression = false; rendre(); }
    window.addEventListener("afterprint", retour);
    try { window.print(); } catch (e) { /* impression indisponible */ }
    setTimeout(retour, 3000);
  }
  function sauvegarder() {
    if (!telechargements) return;
    var json = JSON.stringify({ espace: "visite-orange", sauvegarde_le: new Date().toISOString(), donnees: etat.donnees }, null, 2);
    telechargements.save({ filename: "espace-visite-orange-" + aujourdhui() + ".json", data: new Blob([json], { type: "application/json" }) })
      .then(null, function () { alerter("La sauvegarde n'a pas pu être téléchargée."); });
  }

  /* ---------- Rendu ---------- */

  function pret() { return COLLECTIONS.every(function (c) { return etat.charge[c]; }); }
  function rendre() {
    var actif = document.activeElement, cleActive = actif && actif.getAttribute ? actif.getAttribute("data-cle") : null;
    var corps, entree = etat.entree;
    if (etat.erreur && !pret()) {
      corps = [el("div", { class: "etat-vide" }, [
        el("p", { text: "Le plan ne s'est pas chargé. Vérifiez votre connexion, puis rechargez la page." }),
        el("button", { type: "button", class: "bouton", text: "Recharger", onclick: function () { location.reload(); } })
      ])];
    } else if (!pret()) {
      corps = [el("p", { class: "chargement", role: "status" }, [el("span", { class: "rond", "aria-hidden": "true" }), "Chargement du plan"])];
    } else {
      if (!etat.vu) { etat.vu = true; entree = true; }
      var vues = { afaire: vueAFaire, jour: vueJour, releve: vueReleve, orange: vueOrange, feuille: vueFeuille, remontees: QUESTIONNAIRE ? vueRemontees : null };
      corps = (vues[etat.vue] || vueAccueil)();
    }
    var alerte = etat.alerte ? el("div", { class: "alerte", role: "alert" }, [
      el("span", { text: etat.alerte }),
      el("button", { type: "button", class: "lien-action", text: "Fermer", onclick: function () { etat.alerte = ""; rendre(); } })
    ]) : null;
    document.body.setAttribute("data-vue", etat.vue);
    app.textContent = "";
    app.appendChild(barre());
    app.appendChild(el("main", { class: "page vue-" + etat.vue + (entree ? " entree" : ""), id: etat.vue === "afaire" ? "a-faire" : etat.vue }, [alerte].concat(corps)));
    if (cleActive) {
      var n = app.querySelector('[data-cle="' + cleActive.replace(/"/g, "") + '"]');
      if (n && n.focus) { try { n.focus({ preventScroll: true }); } catch (e) { /* sans focus */ } }
    }
  }

  function demarrer(plateforme) {
    compte = plateforme.compte || {};
    peutModifier = compte.role === "edition" || compte.role === "admin";
    estAdmin = compte.role === "admin";
    if (!compte.intervenant) etat.filtre = "tous";
    if (!etat.feuilleDe) etat.feuilleDe = compte.intervenant || "";
    var t = lire("pvo-theme");
    if (t === "dark" || t === "light") appliquerTheme(t);
    rendre();
    var outils = window.claude && window.claude.use ? window.claude : null;
    if (!outils) { etat.erreur = true; rendre(); return; }
    outils.use("downloads").then(function (d) { telechargements = d || null; }, function () { telechargements = null; });
    chargerRemontees();
    outils.use("db").then(function (base) {
      db = base;
      COLLECTIONS.forEach(function (c) {
        db.collection(c).onSnapshot(function (snap) {
          var o = {};
          (snap.docs || []).forEach(function (d) { var v = d.data(); if (v && typeof v === "object") o[d.id] = v; });
          etat.donnees[c] = o;
          etat.charge[c] = true;
          rendre();
        }, function () { etat.erreur = true; rendre(); });
      });
    }, function () { etat.erreur = true; rendre(); });
  }

  document.addEventListener("click", function () { if (etat.menu) { etat.menu = false; rendre(); } });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (feuille) { fermerFeuille(); return; }
    if (etat.menu) { etat.menu = false; rendre(); var b = app.querySelector(".compte-btn"); if (b) b.focus(); }
  });
  window.addEventListener("hashchange", function () {
    var v = vueDepuisAdresse(), f = feuilleDepuisAdresse();
    if (v !== etat.vue || (v === "feuille" && f && f !== etat.feuilleDe)) { etat.vue = v; if (f) etat.feuilleDe = f; rendre(); }
  });

  P.pret.then(demarrer);
})();
</script>
</body>
